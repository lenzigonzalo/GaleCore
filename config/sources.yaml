# Declarative registry of data sources (GC-AI-0012, AC-01). `python -B -m
# galecore_ai.adapters.cli sources list|query` reads this file together with the
# observed access status kept in `<knowledge>/sources/<id>.md`.
#
# `usage` orders the answer (owner's rule, 29/09): free → own (GaleCore) → daily_quota
# (only when the ones before do not cover the need) → plan; `preference` within each.
#
# Adding a source means adding an entry here. `access_type: galecore_api` and
# `api_key` need a `probe.command` this repo's code can actually run (checked by
# `sources check`); `host_connector` sources have no command — only the host, via
# its own connector, can observe them (`sources declare`).
#
# "covers" lists only what a *registered* capability of this code can actually
# reach; a source's own product may do more (e.g. GaleCore/Tastytrade also serves
# option chains and VIX-family series through other paths), but if this registry's
# probe cannot reach it, it does not belong in `covers` — it goes in `limits`
# instead, so a query never points at a route that then fails.
schema_version: "1"
sources:
  - id: galecore
    display_name: GaleCore (API propia)
    access_type: galecore_api
    cost: sin costo adicional (API propia del ecosistema)
    usage: own
    preference: 0
    covers:
      - category: market_data
        description: cotizaciones y trades de SPY y de cualquier otro símbolo que sirve el DataFeed, incluidos VIX y VVIX (market_data.quote, market_data.trade con symbol=SPY|VIX|VVIX|… — ver application/prepare_regime.py)
        any_symbol: true
      - category: options_state
        description: GEX (compute.gamma_exposure, compute.gex_analysis) y put skew 25Δ (compute.put_skew), por símbolo
        any_symbol: true
      - category: options_chain
        description: cadena de opciones de un subyacente con vencimientos, strikes y símbolos OCC (market_data.option_chains) y griegas de un contrato por su símbolo OCC (market_data.option_greeks); `galecore get ... --out <archivo>` porque la cadena de SPY pesa ~1 MB
        any_symbol: true
      - category: volatility
        description: IV rank e IV percentile (compute.iv_rank), estructura temporal de IV30 y movimiento diario esperado (compute.implied_volatility), índice de IV, percentil, HV, beta y fecha de resultados por símbolo (market_data.volatility_metrics)
        any_symbol: true
      - category: price_history
        description: velas OHLCV históricas e intradía por intervalo (1d, 1h, 5m…) desde una fecha (market_data.candles con interval y fromTime)
        any_symbol: true
      - category: macro_calendar
        description: calendario macro, sólo fechas de publicación programadas según FRED (empleo, precios al consumidor y al productor, PIB, ingresos y gastos, ventas minoristas; calendar.macro_releases) y reuniones del FOMC de la página de la Fed (calendar.fomc_meetings), servidos por GaleCore desde GC-0006
      - category: shadow_runtime
        description: runtime SHADOW de GaleCore Dev — estado, instancias, evaluaciones, descartes, posiciones (con su riesgo máximo) y métricas por versión de estrategia (App/Runtime/Status, App/Runtime/Instances, App/Runtime/Metrics; se lee con `followup run`) y performance por estrategia, versión y regla de salida, de la cartera contra el capital y por operación cerrada contra su plan (App/Runtime/Performance; se lee con `performance`)
    limits:
      - "Sólo lo registrado en capabilities/contracts.py (KNOWN_CAPABILITIES), que se pide con `galecore list|get`; el runtime SHADOW se lee aparte con `followup run`"
      - "IV rank: la historia de IV que guarda GaleCore empieza el 21/09/2026, así que el rango es corto y highIV/lowIV vienen en 0 (observado el 03/10)"
      - "Velas: formato DXLink crudo (FEED_DATA con eventos Candle); griegas: sólo de un contrato por su símbolo OCC, no de un subyacente"
      - "Dos vías con dirección distinta: `sources check`, `prepare` y las capabilities usan GALECORE_BASE_URL (por defecto :5000, sin clave); GaleCore Dev corre en :7001 y el runtime SHADOW se lee con `followup run` (galecore_dev.py, con su autenticación). Un `down` del probe sin GALECORE_BASE_URL/GALECORE_API_KEY apuntando a Dev no dice que GaleCore Dev esté caída (29/09: probe down mientras Dev respondía en :7001)"
    probe:
      description: GET de bajo costo (market_data.trade de SPY) evaluando el código de estado HTTP
      command: python -B -m galecore_ai.adapters.cli sources check --source galecore

  - id: fred
    display_name: FRED (St. Louis Fed)
    access_type: api_key
    cost: clave gratuita (FRED_API_KEY en el entorno del usuario; no persiste entre sesiones)
    usage: free
    preference: 10
    covers:
      - category: rates_curve
        description: tasas del Tesoro (curva), fed funds rate, tasas reales (TIPS, DFII10) y otras series de tasas
      - category: credit
        description: spreads de crédito (high yield BAMLH0A0HYM2, investment grade BAMLC0A0CM)
      - category: inflation
        description: CPI y breakevens de inflación
      - category: activity_employment
        description: nonfarm payroll, desempleo y otras series de actividad
      - category: macro_calendar
        description: >-
          calendario de publicaciones macro programadas (empleo / nonfarm payroll, CPI, PPI, PIB, ingresos y
          gasto personal, ventas minoristas) con fred/releases/dates; se consulta con
          `python tools/fred_query.py <dir> --releases <desde> <hasta> [<release_id> ...]`
    limits:
      - "Calendario de publicaciones: no trae el día de reunión del comité de la Fed; «FOMC Press Release» (release 101) figura todos los días porque publica series diarias (verificado el 30/09, GC-AI-0016)"
      - "Calendario de publicaciones: fechas programadas por la agencia; se pueden mover (cierre de gobierno, reprogramación) y FRED lo refleja cuando la agencia lo publica"
    probe:
      description: GET a fred/series para una serie liviana (metadatos, sin observaciones históricas)
      command: python -B -m galecore_ai.adapters.cli sources check --source fred

  - id: fed
    display_name: Federal Reserve (calendario del FOMC)
    access_type: public
    cost: gratis, sin clave (página pública de la Fed)
    usage: free
    preference: 10
    covers:
      - category: macro_calendar
        description: >-
          fechas de las reuniones del FOMC (comité de la Fed) programadas, con las que traen proyecciones económicas, del año en
          curso y el siguiente; se consulta con `python tools/fed_calendar.py <dir> [<año> ...]`
    limits:
      - "Lee la página HTML de la Fed (fomccalendars.htm): si cambia su forma, la herramienta falla en vez de devolver una lista vacía (verificado el 30/09, GC-AI-0016)"
      - "Sólo reuniones programadas; una reunión o decisión fuera de calendario aparece cuando la Fed la publica"
    probe:
      description: GET a la página del calendario y lectura del año en curso
      command: python tools/fed_calendar.py <dir>

  - id: alpha_vantage
    display_name: Alpha Vantage
    access_type: host_connector
    cost: clave gratuita (límite de plan)
    usage: daily_quota
    preference: 20
    covers:
      - category: rates_curve
        description: tasas y curva de tasas (TREASURY_YIELD, FEDERAL_FUNDS_RATE)
      - category: inflation
        description: inflación (CPI, INFLATION)
      - category: activity_employment
        description: empleo y actividad (NONFARM_PAYROLL, UNEMPLOYMENT)
      - category: earnings_valuation
        description: resultados y estimaciones (EARNINGS, EARNINGS_ESTIMATES, EARNINGS_CALL_TRANSCRIPT)
      - category: scheduled_events
        description: calendario de resultados y salidas a bolsa (EARNINGS_CALENDAR, IPO_CALENDAR)
      - category: volatility_options_external
        description: opciones históricas y put/call ratio histórico (HISTORICAL_OPTIONS, HISTORICAL_PUT_CALL_RATIO)
    limits:
      - "Clave gratuita: 1 consulta/s y 25/día; en paralelo falla por límite (evidencia:2026-09-27-spy-ctx-av-effr-preview)"
      - "Series diarias (TREASURY_YIELD, FEDERAL_FUNDS_RATE): el conector devuelve una vista previa de 2 puntos, no el historial completo (evidencia:2026-09-27-spy-ctx-av-treasury-10y-preview, evidencia:2026-09-27-spy-ctx-av-effr-preview); las mensuales sí devuelven la serie completa"
      - "REALTIME_OPTIONS, REALTIME_PUT_CALL_RATIO y ETF_PROFILE: sin probar con la clave gratuita, no forman parte de covers hasta verificarlos"
    probe:
      description: sin comando propio; el host prueba con la llamada mínima del dato que necesita y declara el resultado (sources declare)
      command: null

  - id: fmp
    display_name: Financial Modeling Prep (FMP)
    access_type: host_connector
    cost: "plan actual insuficiente para varios endpoints: el conector responde que hace falta Starter/Premium/Ultimate/Enterprise (evidencia:2026-09-27-spy-ctx-fmp-economics-calendar-denied)"
    usage: plan
    preference: 30
    covers:
      - category: rates_curve
        description: curva de tasas del Tesoro, treasury-rates (funciona; evidencia:2026-09-27-spy-ctx-fmp-treasury-rates)
      - category: market_data
        description: precio de cierre diario (EOD) de SPY vía chart historical-price-eod-light (funciona; evidencia:2026-09-28-cartera-ctx-fmp-spy-eod)
      - category: quotes
        description: cotizaciones de SPY vía quote/batch-quote (intermitente por plan — ver historia de estado)
      - category: earnings_valuation
        description: calendario de earnings (funciona; filas por corrida sin garantía de cobertura completa)
      - category: scheduled_events
        description: economics-calendar (denegado por plan)
    limits:
      - "economics-calendar y etfAndMutualFunds information denegados por plan (evidencia:2026-09-27-spy-ctx-fmp-economics-calendar-denied, evidencia:2026-09-27-spy-ctx-fmp-etf-information-denied)"
      - "quote/batch-quote: respondió en una sesión y fue denegado en otra sin cambio de código de este lado — el plan puede variar entre sesiones (evidencia:2026-09-27-spy-ctx-fmp-spy-quote, evidencia:2026-09-28-cartera-ctx-fmp-spy-eod)"
      - "Calendario de earnings: corridas con 8 y con 50 filas, posible recorte del endpoint sin verificar (evidencia:2026-09-27-spy-ctx-fmp-earnings-calendar-oct13-16, evidencia:2026-09-28-cartera-ctx-fmp-earnings-oct19-nov6)"
    probe:
      description: sin comando propio; el host prueba con la llamada mínima del dato que necesita y declara el resultado (sources declare)
      command: null

  # ── Pedidas a GaleCore (roadmap §4, Producto 1, fase 1b; contrato en docs/engineering/HANDOFF-GALECORE-FUENTES.md
  # del workspace). Acceso a la fuente original probado el 30/09; todavía no se pueden pedir. Al quedar cada endpoint en
  # GaleCore, pasa a covers de `galecore` y se borra de acá.
  - id: cboe
    display_name: CBOE — historia diaria de VIX, VVIX y SKEW (en GaleCore, pedido)
    access_type: requested
    cost: gratis, sin clave (CSV públicos de CBOE)
    usage: requested
    preference: 90
    covers:
      - category: volatility_history
        description: historia diaria larga de VIX, VVIX y SKEW para percentiles de régimen, tail_score y backtests
    limits:
      - "Acceso a los CSV probado el 30/09; falta el endpoint en GaleCore"
    probe:
      description: sin sonda hasta que GaleCore exponga el endpoint
  - id: treasury
    display_name: Tesoro de EE. UU. — Fiscal Data y curva diaria (en GaleCore, pedido)
    access_type: requested
    cost: gratis, sin clave
    usage: requested
    preference: 90
    covers:
      - category: rates_curve
        description: curva diaria oficial del Tesoro (tasa libre de riesgo por plazo) y calendario y resultados de subastas
    limits:
      - "Acceso probado el 30/09; hasta que exista, la curva sale de FRED"
    probe:
      description: sin sonda hasta que GaleCore exponga el endpoint
  - id: sec_edgar
    display_name: SEC EDGAR — presentaciones y fundamentales XBRL (en GaleCore, pedido)
    access_type: requested
    cost: gratis, sin clave (requiere User-Agent identificado)
    usage: requested
    preference: 90
    covers:
      - category: filings_fundamentals
        description: presentaciones de empresas (8-K, 10-Q, 10-K) y fundamentales XBRL por empresa (ingresos, márgenes, deuda), para análisis fundamental y estrategias de acciones
        any_symbol: true
    limits:
      - "Acceso probado el 30/09; falta el endpoint en GaleCore (User-Agent y caché)"
    probe:
      description: sin sonda hasta que GaleCore exponga el endpoint
  - id: bls
    display_name: BLS — empleo, CPI y PPI de la fuente oficial (en GaleCore, pedido)
    access_type: requested
    cost: gratis (mejor con clave gratuita)
    usage: requested
    preference: 90
    covers:
      - category: activity_employment
        description: valores oficiales del BLS de empleo, CPI y PPI con su detalle por componente
    limits:
      - "Acceso probado el 30/09; complementa lo que ya da FRED"
    probe:
      description: sin sonda hasta que GaleCore exponga el endpoint
