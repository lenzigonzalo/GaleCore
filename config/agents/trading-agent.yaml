agent_id: TradingAgent
version: "1.0.0"
display_name: Trading Agent
description: >
  Cognitive agent for options trading analysis.
  Interprets market microstructure data (GEX, IV, skew)
  and produces structured analytical output.
  Phase 3: read-only analysis only. No trade execution.

skills:
  - gex_interpretation

protocols:
  - facts_discipline

conventions:
  - trading_defaults

allowed_capabilities:
  - compute.gamma_exposure
  - compute.gex_analysis
  - compute.iv_rank
  - compute.implied_volatility
  - market_data.quote

model_preferences:
  provider: fake
  temperature: 0.0
  max_tokens: 4096
