agent_id: TradingAgent
version: "1.1.0"
display_name: Trading Agent
description: >
  Cognitive agent for options trading analysis.
  Interprets market microstructure data (GEX, IV, skew)
  and produces structured analytical output.
  Read-only analysis only (Phases 3–4). No trade execution.

skills:
  - gex_interpretation
  - regime_interpretation

protocols:
  - facts_discipline

conventions:
  - trading_defaults

allowed_capabilities:
  - compute.gamma_exposure
  - compute.gex_analysis
  - compute.put_skew
  - market_data.quote
  - market_data.trade

model_preferences:
  provider: fake
  temperature: 0.0
  max_tokens: 4096
