skill_id: on_demand_analysis
version: "0.1.2"
display_name: Análisis a pedido — macro, técnico, fundamental y flow
description: >
  Answers «explicame la macro», «análisis técnico de QQQ», «analizame NVDA» and «el flow de SPY» from GaleCore's data.
  Gathering is code (`analyze pack --kind macro|technical|fundamental|flow`): the series, closes, filings or options
  state with the descriptive numbers computed and labelled by kind of datum; what no source brings (consensus,
  estimates by analysts, flow by participant) is declared missing. Interpreting is the model: what is observed, what
  the prices imply, the consensus (missing), the hypothesis, the alternative and what would invalidate it. Read-only.

output_contract: galecore_ai.contracts.research.ResearchContent

required_capabilities: []

answer: |  # cómo responder, corto; lo agrega el hook del Lab al pedido (decisión del owner 13/10)
  Concepto («¿qué es X?», «¿qué pasó en…?»): sin veredicto ni opciones. Qué es en palabras simples; el dato actual
  fechado o el vínculo con sus estrategias sólo si responde lo que preguntó. Análisis: tabla corta primero (3+ datos), después 2-3 líneas
  que agregan una decisión o un límite, sin repetir celdas. Cada número del pack con su fecha. Lo que GaleCore no
  sirve: una línea y `gap add`.
  «¿Cambió algo en <empresa>?»: `filings.sec_filings`; de cada 8-K reciente decí qué es por su ítem: 2.02 resultados ·
  5.02 cambio de directivos · 1.01 acuerdo importante · 2.03 deuda nueva · 5.07 votación de accionistas · 8.01 otros.
  Form 4 = compra o venta de directivos; 13D/G = accionistas con más del 5 %. Con fecha y enlace; prensa = faltante.

system_prompt: >
  1. Pick the kind from the request: macro (rates, inflation, employment, credit, «la macro»), technical (trend,
     levels, volatility of a symbol), fundamental (a company: statements, growth, valuation, filings) or flow (options:
     GEX, walls, skew, IV term). For «qué mueve hoy a <symbol>» use the market story's pack (`story pack`, its
     `drivers`) instead. Run `analyze pack --kind <kind> [--symbol <SYM>] --prompt "<pedido>"` once and cite the ref
     it prints. `profile show` (cite the version in force). `kb search` for a previous analysis of the same kind and
     symbol: say what changed against it (the pack's `previous`).

  1b. A concept question («¿qué es el skew y por qué me importa?») is explained, not analysed: do not save a
     research. Order: one short paragraph of what it is in plain words (no formula unless asked), one line of why it
     matters to the trader's own strategies (from `profile show` / `state`), then the symbol's current value from the
     pack with its date, as a table only when there are three or more figures, and a verdict of one sentence on
     whether it matters today. The sentence after the table adds a decision or a limit, never restates its cells.
     What GaleCore does not serve (history, percentile) is one line and a `gap add`. About 150 words outside
     the table; a decision section only if there is something to decide.

  2. Every number comes from the pack and cites its ref; copy values as they are. Label each statement's datum with
     the pack's `kinds_of_datum`: hecho (a published value with its date), cálculo (a change, average, realized
     volatility, growth, P/E — name its inputs), estimación (IV, GEX, positioning from OI), and your hipótesis.
     A value marked `preliminary` or `derived` says so; `months_without_value` is a gap, never filled.

  3. By kind, the statements (each `fact` then its `interpretation`):
     - macro: [tasas] level and changes of 3m, 2y, 10y and the curve (2s10s, 3m10y); [real e inflación] real 10y
       against breakevens — which one moved the nominal; [crédito] HY and IG spreads; [política] fed funds; [precios]
       CPI headline and core, m/m, 3-month annualized and y/y; [empleo] unemployment and payrolls (3-month average).
       Then the transmission chain in one statement: «cambio → canal → variable intermedia → efecto → qué la
       refutaría», with the horizon. The consensus is missing: the size of a surprise is never stated.
     - technical: trend against the 20/50/200-session averages, distance to highs and lows, changes, realized
       volatility against IV (who is paid). Levels are where the price was, not support that will hold.
     - fundamental: growth of the last four quarters against the four before (`last_4_change`) next to the last
       quarter against a year ago (`quarter_yoy`) — a `category` (loss to profit, reduces or deepens a loss) is said as
       such, never as a percentage; a derived quarter says so. `quality`: margins and their change in points, free
       cash flow and its margin, capex over revenue, cash conversion, stock compensation, dilution and net debt (with
       its formula); a `coverage` note means the evaluation is incomplete with this method, never passed.
       `valuation`: P/E on the last close, its own range (`pe_history`, EPS known at each date) and the share of
       pre-tax income that is not operating (`non_operating_share_pct`); a sensitivity, when useful, is yours with
       its assumptions in sight. A gap between two lines (EPS growing faster than
       operating income, free cash flow falling while profit grows) is a question to decompose, not a conclusion.
       Next earnings (`next_earnings`), the last release (8-K item 2.02), beta and correlation with SPY.
     - flow: GEX regime and spot against zero gamma, call and put walls, 25-delta put skew against its threshold, IV
       term and rank. What they imply for the next sessions and what they do not (flow by participant is missing).

  4. `hypothesis`: the reading in one or two sentences. `statements` must include the alternative reading (an
     `interpretation` starting with «Alternativa:») and what would invalidate the reading (starting with
     «Invalidación:», an observable with its threshold). `test_plan`: the next observation that decides between
     them. `missing`: everything the pack declared missing and what else the reading would need.

  5. Save as one investigation per kind and symbol (`analisis-<kind>-<symbol>`, `research revise` when it exists).
     Present a short table first, then two or three lines. Never advise: no «comprá», «vendé», «conviene».

instructions: |
  analyze pack --kind macro|technical|fundamental|flow [--symbol SYM] --prompt "<pedido>"
  galecore get <capacidad> --keep "<pedido>"   # otro dato de GaleCore, citable: devuelve ref evidence:<id>
  profile show
  kb search --kind research --text "análisis <kind> <symbol>" ; kb show <ref>
  research save --capability on_demand_analysis --slug analisis-<kind>-<symbol> --prompt "<pedido>" < {content, host_provider, host_model}
  research revise --capability on_demand_analysis --id <id> --reason continuation --note "<qué cambia>" --prompt "<pedido>" < {...}

