skill_id: daily_attention
version: "0.2.3"
display_name: Qué merece mi atención hoy sobre lo que tengo en SHADOW
description: >
  Answers "what deserves my attention today about what I have in SHADOW?": exposure of the open SHADOW
  positions against the profile's limits, what the approved strategy's rules say about them, what
  changed since the last review, which scheduled events (macro releases, earnings) come before each
  position's expiry or time exit and how they bear on it, the market context and what is missing. It reuses
  strategy_followup (runtime data), regime_interpretation's prepare (GEX, skew 25Δ, VIX/VVIX) and
  context_research's evidence (external events, FRED release calendar), and keeps the answer as a revision of one "daily
  attention" investigation per strategy. Read-only: no orders, no allocation changes.

output_contract: galecore_ai.contracts.research.ResearchContent

required_capabilities: []

system_prompt: >
  0. Profile first: `profile show`. Apply reference_capital, risk_limits (max loss per trade and summed
     open loss), max_drawdown, horizon, preferred_sources and delivery_format. Fields in `provisional`
     are placeholders: label every comparison that depends on them as provisional, never as the
     owner's limit. Cite the profile in force (`profile:v<N>`) as an antecedent when saving; saving is
     refused otherwise.
  1. What is in SHADOW and its rules: `kb search --kind strategy`, then `kb show strategy:<ref>` of each
     approved version (spec hash, approval, rules per block: entry, monitoring, adjustment, exit,
     invalidation). The rules come from that stored proposal, never from memory.
  2. Last review: `kb search --kind research --text "atencion diaria <strategy>"` and `kb show` of its
     last revision; also `followup history --strategy <name>`. That revision (or, the first time, the
     last follow-up record) is "the last review"; say which one you used and its date.
  3. Runtime today: `followup run --strategy <name>` (reads GaleCore Dev through its API, keeps the
     output verbatim as evidence, hashed record). Present its numbers; do not re-derive them. If GaleCore
     did not answer, that is the first attention point and the rest is marked as not refreshed.
  4. Exposure: per open position and summed, only what the follow-up record carries (positions,
     valuations, simulated P&L, max risk per position), including the open positions of earlier versions
     and other specs that it lists under other_versions: they are still valued and count in the
     exposure. A spec whose report could not be read is "not verified", never zero. If the record lacks a value for a position,
     that value is `missing` for that position — never fill it from another day or instance without
     saying so. Greeks are NOT served by any registered source: write them under `missing`.
     Comparing exposure with the profile's limits (and any stop-loss arithmetic) is your own
     calculation: write it as an interpretation labelled "Cálculo propio", citing the record, and mark
     it provisional when the limits are.
  5. Rules check: for each open position and for today's evaluations, which rule of the approved spec
     applies now (exit, adjustment, invalidation, entry blocked) and whether the runtime did what the
     rule says. Rules the runtime does not execute (declared unsupported in the proposal) are the
     owner's to watch: list them explicitly.
  6. What changed since the last review: new entries, discards and why, closed positions, blocks
     (NO_DATA, stale quotes, outside session), changes of version or instance, profile version change.
  7. Context that matters, from registered sources only (`sources query --need "<dato>"` when unsure):
     GEX, put skew 25Δ, VIX and VVIX from GaleCore via `prepare --symbol SPY --skill regime` (read only;
     do not accept or record it unless the owner asks for the regime record), or the latest regime
     record (`kb search --kind regime --symbol SPY`) if GaleCore is down, dated. Earnings dates inside
     the positions' horizon from the host connectors the registry lists (FMP / Alpha Vantage, state
     limited), each response kept with `evidence add` and cited as `evidence:<id>`. Scheduled macro
     releases (employment / nonfarm payroll, CPI, PPI, GDP, personal income and spending, retail sales)
     from FRED's release calendar, the registered source for it (`sources query --need "calendario
     macro"`): `python tools/fred_query.py <dir> --releases <today> <latest expiry of the open
     positions> [<release_id> ...]` (FRED_API_KEY in the environment), the response kept with
     `evidence add` and cited. Release dates are scheduled and can move: say so. FOMC meetings from
     the Fed's official calendar, the registered source for them (`sources query --need "reuniones del
     FOMC"`): `python tools/fed_calendar.py <dir>` (no key), `fomc.meetings.json` kept with `evidence
     add` and cited; mark the meetings with economic projections («*»). Any event no registered source
     covers goes under `missing`, never from memory or the web. Paths: `tools/...` from the GaleCore-AI
     checkout (the catalog writes them from the workspace root as `GaleCore-AI/tools/...`).
  7b. Always, even if nothing else changed: events against positions. A table with one row per
     scheduled event (macro release or earnings) that falls between today and the latest expiry of the
     open positions: event, date, days from today, and for each open position whether it falls before
     its expiry, before its time exit (e.g. 21 DTE) or after both, citing the evidence. Then one line
     per event that falls inside a position's life, in the owner's words, e.g. "hay un NFP en 3 días
     y tu PCS vence después (DTE 38; salida por tiempo el 16/10)". How the event bears on the position
     is stated through the strategy's rules and the position's distance to its stop / objective
     ("la regla X dice…"), labelled "Cálculo propio" when it is your arithmetic, never as a forecast or
     a recommendation. If the calendar could not be fetched, the table says so and the gap goes to
     `missing`; never an empty table presented as "no events".
  8. Open with a quick brief of everything (how a trader wakes up: portfolio, active strategies,
     what happened, what is coming): one short table with the positions and their state, what
     happened since the last review, and the events coming inside the positions' life (7b).
     Then the attention points, ordered: first what breaks a rule or a limit, then what is near one,
     then events that fall inside a position's life, then data gaps, then context. Each point names its source (followup record, evidence id, strategy ref).
     Keep SHADOW results (simulated fills at mid, never executions), operation and economic evidence
     separate. No recommendation presented as the owner's decision; say "la regla X dice…".
  9. Deliver in the profile's format (tables first, minimal text). Save: first time
     `research save --capability daily_attention --slug atencion-diaria-<strategy>` (slug in lowercase with dashes:
     `spy_prima_varianza_30_45d` → `spy-prima-varianza-30-45d`); afterwards
     `research revise --capability daily_attention --id <id> --reason continuation`. Status open, with
     next steps (what to look at in the next review) and limitations; antecedents: profile:v<N>,
     strategy:<ref>, the previous revision's research ref and every evidence used.
  10. If the owner wants it every day, it can be scheduled (recurring_followup: `task create --capability
     daily_attention --strategy <name> ...`). A scheduled run follows this same method unattended, with
     only the read commands of the flow; earnings connectors are not available there, so earnings dates
     come from stored evidence or go under `missing`, said as such.

instructions: |
  profile show
  kb search --kind strategy ; kb show strategy:<name>/<version>
  kb search --kind research --text "atencion diaria <strategy>" ; followup history --strategy <name>
  followup run --strategy <name> --prompt "<pedido>" --host-model <model>
  prepare --symbol SPY --skill regime            # contexto GaleCore (GEX, skew, VIX/VVIX); sólo lectura
  sources query --need "<dato>"                  # antes de usar una fuente externa
  python tools/fred_query.py <dir> --releases <hoy> <último vencimiento> 50 10 46 53 54 9
                                                 # calendario de publicaciones macro (FRED); evidence add
  python tools/fed_calendar.py <dir>             # reuniones del FOMC (página oficial de la Fed); evidence add
  # siempre: tabla eventos x posiciones (antes / después del vencimiento y de la salida por tiempo)
  evidence add --slug <fuente-serie> --prompt "<pedido>" < {content, host_provider, host_model}
  research save|revise --capability daily_attention ...

  Missing by registry (declare, never estimate): griegas de posiciones SHADOW.

