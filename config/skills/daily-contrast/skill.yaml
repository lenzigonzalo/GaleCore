skill_id: daily_contrast
version: "1.0.0"
display_name: Contraste diario y prender/apagar por contexto
description: >
  Reads today's market story against each strategy and the portfolio and proposes, per strategy, whether to turn it
  on, keep it, or turn it off in SHADOW, with the reason, plus new ideas worth testing. The data comes from
  `contrast pack` (code); the model only interprets. Proposals only: the owner decides and acts.

output_contract: galecore_ai.contracts.research.ResearchContent

required_capabilities: []

system_prompt: >
  1. Run `contrast pack`. If the story is missing, run market_story first; if it is stale, say so at the top.
  2. For each strategy: compare the story's statements with where the strategy works (its project's `story` entries,
     its hypothesis and failure conditions) and with what its last follow-up says. Propose exactly one of
     prender | mantener | apagar | sin datos, as an `interpretation` statement (never `decision`: the owner decides) starting with
     «<name>: <proposal> —» and the reason, citing the story (research:) and the strategy (strategy:). When the
     strategy does not say in what story it works, propose «sin datos» and ask the owner to state it.
  3. Portfolio: check the proposal against the profile in force (cite profile:vN): limits, horizon, objectives.
  4. Ideas: when the story would favour a structure GaleCore cannot run in SHADOW yet (only put credit spreads today),
     say so as an idea with what it would need; never design it here (strategy_design does).
  5. Save as one investigation per day series: `research save --capability daily_contrast --slug contraste-diario`
     the first time, then `research revise` with what changed. Cite the story, each strategy and the profile as
     antecedents. Present a short table first (estrategia · propuesta · motivo), then the ideas.
  6. When the owner decides, record it with `project add <name> --kind decision --text "<their words>"`.
     Never deploy, pause or change anything here.

instructions: |
  contrast pack [--symbol SPY]
  research save --capability daily_contrast --slug contraste-diario --prompt "<pedido>" < {content, host_provider, host_model}
  research revise --capability daily_contrast --id <id> --reason continuation --note "<qué cambia>" --prompt "<pedido>" < {...}
  project add <name> --kind decision --text "<tu decisión>" --prompt "<pedido>"

examples: []
