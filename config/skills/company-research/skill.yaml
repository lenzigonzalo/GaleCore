skill_id: company_research
version: "0.3.0"
display_name: Investigar una empresa (o elegir entre varias)
description: >
  «Analizame MSFT», «investigá NVDA», «¿qué tal está AAPL a este precio?», «de MSFT, AAPL y NVDA, ¿cuál tiene
  tendencia alcista y fundamentos que la sostengan?». Dos recorridos (WS-0047): Investigar entiende una empresa aunque
  no cumpla ningún criterio (negocio, calidad, salud financiera, valoración, eventos, riesgos); Seleccionar compara una
  lista contra un criterio declarado. Junta y calcula el código (`analyze pack`); el modelo interpreta: la tesis, qué
  tiene que pasar en 6–12 meses para que funcione y qué la rompe. Lectura: no recomienda comprar ni vender.

output_contract: galecore_ai.contracts.research.ResearchContent

required_capabilities: []

answer: |  # lo agrega el hook del Lab al pedido (lo único que reciben todos los motores): herramientas y cuidados, no forma
  Datos del día, siempre de nuevo: `analyze pack --kind fundamental|technical --symbol X` (y macro si hace falta); para
  varias empresas, `analyze company --symbols A,B,C` junta todo en paralelo en una tabla de cifras (~1 min). Una
  investigación guardada es antecedente para decir qué cambió, nunca la fuente de los números. Competidores, ETF de
  comparación, el 10-K (`filings.sec_document`): cuando el pedido los necesita; GaleCore sirve el pack de cualquier
  empresa listada, así que «no hay datos de competidores» no vale sin haberlo pedido.
  Cuidados que vienen de errores reales: el P/E solo engaña si el resultado no operativo pesa (`non_operating_share_pct`)
  o en financieras y cíclicas; el flujo libre del pack es del accionista; la media 200 no es un corte de pérdida; los
  escenarios o sensibilidades que armes muestran sus supuestos y la cuenta. Lectura, no consejo de compra o venta.
  Si es una investigación (no una consulta al paso), guardala o revisá la anterior (`research save|revise`).

system_prompt: >
  Investigate one company or compare several with GaleCore's packs; the request sets the aim, the horizon and the
  criterion, and the answer follows it — no fixed table, blocks or closing lines. What the code gives: the
  fundamental pack (reported quarters from SEC filings: growth, margins, free cash flow, capex, net debt with what it
  includes, dilution, capital returned, P/E with its own history, EV multiples, the non-operating share of pre-tax
  income, next earnings), the technical pack (averages, returns, realized volatility against IV) and the macro pack;
  `analyze company` puts several side by side with relative strength against SPY and a default sector ETF (ask for
  another ETF's technical pack when that one represents the business poorly). Every figure keeps its date and source;
  what the packs declare missing (consensus beyond next EPS, guidance, news) is said when it matters to the answer.
  Value by business model, not one multiple for all; a gap between two lines (EPS against operating income, cash
  against profit) is a question to decompose, not a conclusion. Never advise buying or selling: positioning is another
  step. An investigation is retaken later: save it (`empresa-<symbol>`, `seleccion-<tema>`) or revise the previous one
  saying what changed.

instructions: |
  analyze company --symbols A,B,C --prompt "<pedido>"                 # varias empresas: cifras lado a lado
  analyze pack --kind fundamental --symbol SYM --prompt "<pedido>"
  analyze pack --kind technical --symbol SYM --prompt "<pedido>"      # también SPY o un ETF de comparación
  analyze pack --kind macro --prompt "<pedido>"
  galecore get filings.sec_document --param Ticker=SYM --param Items=1,1A,7 --param MaxChars=30000 --keep "<pedido>"
  profile show
  kb search --kind research --text "empresa <symbol>" ; kb show <ref>
  research save --capability company_research --slug empresa-<symbol> --prompt "<pedido>" < {content, host_provider, host_model}
  research revise --capability company_research --id <id> --reason continuation --note "<qué cambia>" --prompt "<pedido>" < {...}

examples: []
