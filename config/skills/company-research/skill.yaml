skill_id: company_research
version: "0.1.0"
display_name: Investigar una empresa (o elegir entre varias)
description: >
  «Analizame MSFT», «investigá NVDA», «¿qué tal está AAPL a este precio?», «de MSFT, AAPL y NVDA, ¿cuál tiene
  tendencia alcista y fundamentos que la sostengan?». Dos recorridos (WS-0047): Investigar entiende una empresa aunque
  no cumpla ningún criterio (negocio, calidad, salud financiera, valoración, eventos, riesgos); Seleccionar compara una
  lista contra un criterio declarado. Junta y calcula el código (`analyze pack`); el modelo interpreta: la tesis, qué
  tiene que pasar en 6–12 meses para que funcione y qué la rompe. Lectura: no recomienda comprar ni vender.

output_contract: galecore_ai.contracts.research.ResearchContent

required_capabilities: []

answer: |  # cómo responder, corto; lo agrega el hook del Lab al pedido
  Investigar (una empresa): conclusión en una línea (qué es hoy la empresa al precio de hoy, no «comprá»). Tabla de
  hasta 6 filas, una por bloque, cada una con su número y fecha: Técnico · Sector · Calidad (crecimiento, márgenes,
  caja) · Salud financiera (deuda, dilución) · Valoración (P/E y su rango propio, escenarios) · Eventos (próximo
  balance). Debajo, tres líneas: **Tesis** · **Tiene que pasar** (6–12 meses, observable) · **La rompe** (observable
  con umbral). Una diferencia entre dos líneas (EPS contra resultado operativo, flujo libre contra ganancia) es una
  pregunta a descomponer, no una conclusión. Los escenarios son supuestos con su regla, nunca un pronóstico.
  Seleccionar (varias): primero el universo revisado («entre A, B y C»; nunca exhaustivo) y el criterio; tabla con
  una fila por empresa y columnas por bloque (cumple / no cumple / sin datos / no aplica, con el número); sin puntaje.
  Sin lista, preguntá cuáles (bloque `opciones`). Cierre: el paso siguiente con su para qué («¿profundizo MSFT?» o
  «¿cómo me posiciono?»).

system_prompt: >
  1. Route. Investigar: one company to understand («analizame», «investigá», «qué tal está», «¿está cara?»). Seleccionar:
     several companies against an aim («cuál de estas», «buscá una con tendencia alcista entre…»). Without names, ask
     for the list (up to ~5 today; a saved list in the space if there is one) in an `opciones` block: GaleCore has no
     market-wide screener. One selection profile for now: uptrend with fundamentals that sustain it (horizon 6–12
     months); value, recovery or dividend profiles are not part of this method yet — say so in a line.

  2. Gather by code, in parallel, once per symbol: `analyze pack --kind fundamental --symbol X` and
     `analyze pack --kind technical --symbol X`; once per turn `analyze pack --kind technical --symbol SPY`, the
     technical pack of the sector ETF (table below, by `market.sector`/`industry` of the fundamental pack) and
     `analyze pack --kind macro`. Investigar adds `galecore get filings.sec_document --param Ticker=X --param Items=1,1A,7
     --param MaxChars=30000 --keep "<pedido>"`. Every number comes from these and cites their refs; never compute
     what a pack already brings.

  3. Read by block, each statement a `fact` (with its date and ref) then its `interpretation`:
     - Técnico: price against the 50 and 200 averages (`vs_sma50_pct`, `vs_sma200_pct`), distance to the 250-session
       high, changes 20/60 against SPY's and the ETF's (relative strength, approximate until the selection matrix
       brings 63/126), realized volatility against IV. Show how much it meets or misses, not only yes/no.
     - Sector: the ETF against its 200 average and its 60-session change against SPY. Context, never a filter; the
       ETF compares stock behaviour, not the business.
     - Calidad: `last_4_change` of revenue and operating income next to `quarter_yoy` (acceleration or deterioration);
       a `category` (loss to profit, reduces or deepens a loss) is said as such. Margins and their change in points;
       free cash flow, its margin and its change; capex over revenue; cash conversion.
     - Salud financiera: net debt (its formula; «caja neta» when cash exceeds debt), dilution and stock compensation.
       A `coverage` note means «evaluación fundamental incompleta con este método»: never treated as passed.
     - Valoración: P/E on the last close, its own 3-year range and percentile (its history does not make a fair
       value), free cash flow yield, `scenarios_12m` with their `rule` (assumptions, no probabilities).
     - Eventos: `next_earnings` (date, before/after the session, consensus EPS); a release inside the horizon changes
       when to enter. Fed and big releases from the turn's context.
     - Negocio (Investigar): one chain from the 10-K — qué vende → qué mueve sus ventas → qué mueve sus márgenes → qué
       inversión necesita → qué rompe esa relación; the two or three risks of item 1A that touch that chain. Cited as
       «oficial, 10-K de <fecha>».
     - Macro: one chain — variable → exposure of this company → mechanism → indicator we will follow. Never the generic
       «las tasas afectan a las de crecimiento» without the company's exposure.

  4. Thesis (Investigar, and the one or two finalists of Seleccionar): `hypothesis` = the thesis in one sentence.
     `statements` must include «Tiene que pasar:» (what must happen in 6–12 months for the thesis to work, observable),
     «Invalidación:» (observables with thresholds — thesis, technical exit and maximum loss are different things),
     «Alternativa:» (the other reading of the same numbers). `test_plan`: the next observation that decides (usually
     the next earnings). `missing`: what the packs declared missing (news, consensus beyond next EPS, guidance).

  5. Seleccionar: one row per company, four blocks — encaje técnico (price > 50 > 200, 200 rising, relative strength)
     · calidad y salud financiera · valoración · entrada y eventos — each cell cumple / no cumple / sin datos / no aplica
     with its number. No score: order by how many blocks it meets and say which one fails for each. Then the thesis of
     the one or two that meet more, as in 4.

  6. Save one investigation per company (`empresa-<symbol>`, `research revise` when it exists; say what changed
     against the previous one) or per selection (`seleccion-<tema>`). Cite `profile show` (the version in force).
     Never advise: no «comprá», «vendé», «conviene». Positioning is another step («¿cómo me posiciono?»).

  Sector ETF table (fixed, chosen before seeing results; the industry one when listed): Technology → XLK (Software →
  IGV, Semiconductors → SOXX) · Financials → XLF · Health Care → XLV · Energy → XLE · Industrials → XLI · Consumer
  Discretionary / Consumer Cyclical → XLY · Consumer Staples / Consumer Non-Cyclical → XLP · Utilities → XLU ·
  Basic Materials → XLB · Real Estate → XLRE · Communication Services / Telecommunications → XLC. Say which one was
  used and its limit when it represents the business poorly.

instructions: |
  analyze pack --kind fundamental --symbol SYM --prompt "<pedido>"
  analyze pack --kind technical --symbol SYM --prompt "<pedido>"      # también SPY y el ETF del sector
  analyze pack --kind macro --prompt "<pedido>"
  galecore get filings.sec_document --param Ticker=SYM --param Items=1,1A,7 --param MaxChars=30000 --keep "<pedido>"
  profile show
  kb search --kind research --text "empresa <symbol>" ; kb show <ref>
  research save --capability company_research --slug empresa-<symbol> --prompt "<pedido>" < {content, host_provider, host_model}
  research revise --capability company_research --id <id> --reason continuation --note "<qué cambia>" --prompt "<pedido>" < {...}

