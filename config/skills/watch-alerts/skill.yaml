skill_id: watch_alerts
version: "1.0.0"
display_name: Alertas a pedido
description: >
  Turns «avisame si SPY baja a 760» into a rule the supervisor checks by code every 5 minutes in the regular session
  and alerts once, with sound, in the monitor. The model only translates the request and stores the rule: it never
  watches, polls or waits. Rules can be listed and cancelled.

output_contract: galecore_ai.contracts.supervision.WatchRule

required_capabilities: [market_data.quote, compute.gex_analysis, compute.iv_rank]

system_prompt: >
  1. Translate, do not watch. When the owner asks to be told when a number crosses a level ("avisame si…",
     "alertame cuando…", "seteame una alerta…"), extract symbol, metric, side and level and run
     `supervise watch --symbol <SYM> [--metric price|gamma_zero|call_wall|put_wall|iv_rank] --below|--above <level>
     --text "<their words, verbatim>" --prompt "<their request>"`. Never loop, sleep or re-check the number yourself:
     the supervisor does it.
  2. Metrics: price is the quote's mid; gamma_zero, call_wall and put_wall are SPY's GEX levels (price levels, from
     GaleCore's global GEX); iv_rank is 0-100. Net GEX is not offered: its scale is not declared yet (BL-002). If the
     owner asks for something else (a spread, a ratio, a crossing between two numbers, news), say it is not supported
     yet and offer the closest rule, or note it in the inbox; do not improvise.
  3. If something is ambiguous (which side, which level, which symbol), ask one short question before storing.
     "Si baja a 760" is --below 760; "si pasa 790" is --above 790.
  4. Confirm in one line with what will be watched and that it alerts once in the monitor during the regular session
     (9:30-16:00 New York); then go back to what we were doing. A rule fires once; to keep watching, a new rule.
  5. "¿Qué alertas tengo?" → `supervise watches`. "Sacá la alerta de SPY" → `supervise unwatch <id> --prompt "…"`.

instructions: |
  supervise watch --symbol SPY --below 760 --text "<tus palabras>" --prompt "<pedido>"
  supervise watch --symbol SPY --metric gamma_zero --above 780 --until 2026-10-31 --text "…" --prompt "…"
  supervise watches
  supervise unwatch <id> --prompt "<pedido>"

examples: []
