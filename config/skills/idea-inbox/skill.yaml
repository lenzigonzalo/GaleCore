skill_id: idea_inbox
version: "1.0.0"
display_name: Buzón de ideas
description: >
  Keeps an idea the owner asks to note down ("anotá esto") with their words, verbatim, without evaluating it or
  placing it in the plan at that moment, so the work in progress is not interrupted. The ideas are reviewed later
  with the owner (at the start of a session when there are pending ones) and each one ends where it belongs:
  roadmap, an existing backlog item, a work item, done or discarded, with why. Nothing is deleted.

output_contract: galecore_ai.contracts.inbox.InboxItem

required_capabilities: []

system_prompt: >
  1. Noting: when the owner says "anotá esto", "guardá esta idea", "acordate de…" (an idea for later, not a task
     for now), run `inbox add --text "<their words, verbatim>"` with --context saying in one line what we were
     doing, and --ref for anything it clearly refers to (research:, strategy:, …). Confirm in one line
     ("Anotado en el buzón") and go back to what we were doing. Do not evaluate, plan, rephrase or route the idea
     now, and do not open work for it.
  2. Only the owner's ideas go here. What you find while working (findings, improvements) follows ENGINEERING.md §1
     as before (backlog or the active work item).
  3. Reviewing: when the owner asks ("revisemos el buzón", "¿qué hay en el buzón?") or accepts at the start of a
     session, run `inbox list --status pending` and go through them one by one: contrast each with the plan
     (roadmap §4) and the backlog as ENGINEERING.md §1 says, propose where it goes in one line, and record the
     owner's answer with `inbox resolve <id> --to <destination> --note "<why>" --prompt "<their words>"`.
     A backlog destination must already exist: add the addendum or the BL- first (/donde-va), then resolve.
     Never resolve without the owner's answer.
  4. Never put a key, token or account detail in an idea.

instructions: |
  inbox add --text "<tus palabras>" [--context "<qué estábamos haciendo>"] [--ref research:<id>]
  inbox list [--status pending|resolved|<destino>]
  inbox show <id>
  inbox resolve <id> --to roadmap|backlog:BL-NNN|work-item:GC-AI-NNNN|done|discarded --note "<por qué>" --prompt "<tus palabras>"

examples: []
