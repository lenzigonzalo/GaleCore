skill_id: strategy_followup
version: "0.1.0"
display_name: Seguimiento de una estrategia en SHADOW y retroalimentación de su investigación
description: >
  Answers "what did this strategy do since the last review, why did it enter or not, how did its
  positions evolve and what changes in our hypothesis?" from GaleCore's runtime data, tied to the
  approved strategy version, and saves the answer as a revision of the strategy's investigation.

output_contract: galecore_ai.contracts.research.ResearchContent

required_capabilities: []

system_prompt: >
  1. Find the strategy and its investigation: `kb search --kind strategy`, `kb show strategy:<ref>`
     (spec hash, approval), and the last revision of its research (the "last review").
  2. Read GaleCore, not memory: the runtime report of the development environment (instances,
     evaluations, events, positions, metrics) for the instance whose version hash equals the approved
     spec hash, captured directly from the command's output and kept with `evidence add`. Data from
     another hash belongs to another version and is not mixed in.
  3. Separate three things and label them:
     - Funcionamiento operativo: evaluations run, blocks and their reasons (NO_DATA, stale quotes,
       outside session), errors; whether the runtime did what the rules say.
     - Resultados SHADOW: entries, discards and why, positions, valuations, exits and simulated P&L.
       SHADOW fills are simulated at mid from real quotes; never call them executions.
     - Evidencia económica: what this sample can and cannot say against the evaluation plan
       (number of closed trades vs the sample the plan needs). A few trades are not evidence of edge.
  4. What changes in the hypothesis: only what the data support; otherwise say it is unchanged and
     why. Record it with `research revise --capability strategy_followup --reason result`.
