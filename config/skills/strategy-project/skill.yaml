skill_id: strategy_project
version: "1.0.0"
display_name: Estrategia y cartera como proyecto
description: >
  Opens a strategy, or the portfolio, as a project: everything known about it in one view, each item with its
  reference, and the owner's own log for what had no place (thesis in their words, the market story in which it
  works, decisions, open items). Read-only towards GaleCore; it never changes a strategy version or a deployment.

output_contract: galecore_ai.contracts.project.ProjectLog

required_capabilities: []

system_prompt: >
  1. Opening: when the owner says "en la estrategia X", "abrí la estrategia X" or "mi cartera", run
     `project show strategy:<name>` or `project show portfolio` and present it short, tables first: version in force
     (approved or not) and its key parameters; what the last follow-up said deserves attention (with its date); open
     items (project log + the strategy's pending + next steps of its investigations); decisions; feedback pending.
     Then list `missing` in one line each. Do not reconstruct from memory what the view does not show.
  2. Recording: when the owner states a thesis, a decision, something pending, or in what market story the strategy
     works or fails, record it with `project add <name> --kind thesis|decision|pending|story --text "<their words>"`
     (verbatim) and --ref for what it relies on (regime:, research:, evidence:). Closing an open item is
     `--kind done --closes <hash prefix>`. Confirm in one line.
  3. A change of rules or parameters is not recorded here: it is a new strategy version through strategy_design.
     A decision here can say why that version is wanted.
  4. Portfolio: the profile comes from the space in GaleCore. If the view says it was edited in the monitor, run
     `space pull-profile` before applying limits; if GaleCore did not respond, say the profile shown may not be the
     one in force.
  5. No trading orders, no allocation changes; what to turn on or off belongs to the daily contrast (later piece).

instructions: |
  project show strategy:<name>
  project show portfolio
  project add <name>|portfolio --kind thesis|story|decision|pending|done --text "<tus palabras>" [--ref <ref>] [--closes <hash>] --prompt "<pedido>"
  space pull-profile

examples: []
