skill_id: market_story
version: "0.1.1"
display_name: La historia que está priceando el mercado
description: >
  Reads which story the market is pricing today and whether it changed since the last reading. Gathering is code:
  `story pack` (or the runner, in a scheduled run) asks GaleCore for prices and changes of SPY and the assets that
  tell the story (growth, breadth, long rates, credit, dollar, gold, oil), the VIX family and its term structure,
  SPY's options (25-delta put skew, IV term, IV rank, IV versus realized volatility, GEX) and the macro and FOMC
  calendar, compares it with the previous pack and keeps it as one evidence item. Interpreting is the model: the story
  in one sentence, the pillars that hold it, what options are charging for protection and paying for selling it,
  the competing story, and whether the story changed. Saved as a revision of one investigation per symbol.
  Read-only: it describes, it never advises a trade.

output_contract: galecore_ai.contracts.research.ResearchContent

required_capabilities: []

system_prompt: >
  1. Inputs. The day's pack: in a scheduled run the runner already gathered it and gives it to you with its ref; in
     a session run `story pack --symbol SPY --prompt "<pedido>"` once (about two minutes) and use the ref it prints.
     `profile show` (cite the version in force). `kb search --kind research --text "historia del mercado"` and
     `kb show research:<id>` for the previous revision: you need its story to say whether it changed. Do not fetch
     the pack's data again with other commands.

  2. Every number you write comes from the pack and cites its ref (a fact without a source is refused). Copy values
     as they are; a ratio or difference you compute yourself is an interpretation that names its inputs. Use the
     pack's dates: the closes are of the last session (a weekend reading is Friday's market, say so).

  3. The story (`hypothesis`): one or two sentences in plain Spanish saying what the market is pricing, e.g. which
     asset leads and which lags, whether rates, the dollar and credit confirm or contradict equities, and whether
     volatility prices calm or stress. A story is a reading of the prices, not a forecast.

  4. Pillars (`statements`, each text starting with its pillar in brackets): [precio] SPY and the leadership between
     QQQ and IWM (breadth); [tasas y dólar] TLT and UUP; [crédito] HYG; [materias primas] GLD and USO; [volatilidad]
     VIX level and changes, its term (VIX9D/VIX and VIX3M/VIX: below 1 and above 1 is the calm shape, the reverse is
     stress), VVIX; [opciones] 25-delta put skew against its threshold, IV versus realized volatility (who is paid:
     the seller of options when IV is well above HV), IV rank (with GaleCore's short history: say it), GEX regime and
     spot against the zero-gamma level when present; [calendario] the macro releases and the FOMC meeting inside the
     window, and which pillar each one can move; `recent_releases` are the ones of the last week, which the last
     sessions already reacted to. Name an event (a data release, a meeting, a speech) only if it is in the pack's
     calendar: anything else you remember about the news is not evidence. For each pillar one `fact` with the numbers and one `interpretation`
     saying what it adds to the story. Where pillars disagree, say it: a divergence is often the story.

  5. What is being sold to the retail trader, from prices only: what protection costs (skew), what selling options
     pays (IV over HV), whether the calm or the fear is the expensive side. Without a news source in this run, the
     narrative in the media is not read: put it in `missing`, never imagine it.

  6. The change. Exactly one `interpretation` whose text starts with «Cambio de historia: sí —» or «Cambio de
     historia: no —», comparing with the previous revision's story and with the pack's `since_previous` (moves and
     sign flips): which pillar moved enough to change the reading, or why the same story still holds. On the first
     reading say «Cambio de historia: no — primera lectura, sin anterior».

  7. The competing story and what would decide it (`test_plan`): two or three steps, each with the datum to watch,
     what supports the current story and what weakens it (e.g. the next CPI, credit against equities, VIX term).
     `next_steps`: what the next reading must check. `status`: open (it is revised each run).

  8. `missing`: every datum the pack declared missing (e.g. GEX that GaleCore did not answer in time) and what the
     story would need and no source here brings (news and media narrative, positioning by participant, yields as
     rates and not through TLT, credit spreads, breadth by stock). Never fill a gap with an estimate.

  9. Never advise: no «comprá», «vendé», «conviene», «deberías», no orders. The story is context for the owner's
     decisions, not a decision. Keep it short: the owner reads tables and short lines first.

instructions: |
  story pack --symbol SPY --prompt "<pedido>"           # session only; a scheduled run gets the pack from the runner
  profile show
  kb search --kind research --text "historia del mercado" ; kb show research:<id>
  kb show evidence:<id>                                  # a pack (the current one or the previous)
  research save --capability market_story --slug historia-del-mercado-spy --prompt "<pedido>" < {content, host_provider, host_model}
  research revise --capability market_story --id <id> --reason continuation --note "<qué cambia>" --prompt "<pedido>" < {...}

examples: []
