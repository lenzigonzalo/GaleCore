# Qué cambió en cada versión de strategy_design y qué feedback lo originó (GC-AI-0016). La más nueva primero.
skill_id: strategy_design
versions:
  - version: "1.1.0"
    date: 2026-10-11
    changes: >
      P1-PPa (WS-0023, owner 10/10): antes de recomendar, `strategy controls` (ejecutada / vigilada / sólo declarada e
      indispensables); sin los indispensables ejecutados no se recomienda aprobar (observado en C5b de WS-0022). Las
      estructuras desplegables se leen de `state` (decía «sólo PCS»). Pausar una estrategia es detener su instancia,
      no el switch global (observado en C0); reanudar es una instancia nueva con trazabilidad; reanudar o revisar va al
      supervisor.
    feedback: []
  - version: "1.0.0"
    date: 2026-10-06
    changes: >
      WS-0016 (P1-06): la skill se parte en método (parte A) y procedimiento de SHADOW (parte B); suma tabla de
      parámetros, árbol de gestión (disparador → acción), el crítico antes de aprobar (`strategy critique`; sin
      crítica o con «descartar» no se aprueba) y la ficha de una página (`strategy sheet`) como salida estándar. La ficha
      pone la versión contra el perfil (pérdida por operación, peor caso sumado, kill switch, lo abierto en SHADOW)
      y el método trae el contexto del instrumento con `story pack` (AC-02). Una versión nueva dice qué cambia y por qué
      (`change`) y `strategy diff` muestra la diferencia por código (AC-05). Lo que invalida la tesis
      se registra como regla del supervisor con `--thesis` y sus estrategias (AC-07).
      La ficha suma PCS / CCS / iron condor / esperar con la cadena real que calcula GaleCore
      (`/App/Runtime/Structures`, AC-03/04); sólo el PCS se despliega hasta P1-07.
    feedback: []
  - version: "0.3.1"
    date: 2026-09-27
    changes: >
      Correcciones de Codex C1: campos de semántica única, gates por hoja, deploy atado a la aprobación (GC-AI-0008). Versiones anteriores: git log de skill.yaml (el historial empieza con GC-AI-0016).
    feedback: []
