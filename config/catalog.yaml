# What the host can ask GaleCore-AI for. `python -B -m galecore_ai.adapters.cli catalog` prints
# this with the version and hash of each skill as loaded. Start here, not from a table in prose.
#
# Adding a capability: add an entry here and its skill asset under skills/. Anything the entry's
# flow needs that does not exist yet (a prepare function, a validator, a store, a command) is code;
# the entry names the commands, so what was declared and what was programmed stays visible.
catalog_version: "1"
entries:
  - id: gex_interpretation
    kind: interpretation
    serves: Interpretar la exposición gamma (GEX) actual de un símbolo con datos de GaleCore.
    example_requests:
      - Analizá el GEX actual de SPY.
    skill: skills/gex-analysis/skill.yaml
    output_contract: galecore_ai.contracts.gex_analysis.GexInterpretation
    galecore_capabilities: [compute.gex_analysis]
    data_needs:
      - need: GEX
    prepare_skill: gex
    flow:
      - prepare --symbol <SYMBOL> --skill gex
      - accept < {run_id, interpretation, host_provider, host_model}
    stored_as: none
    controls:
      - Numbers only in quantitative_claims, each equal to a GaleCore fact with its unit
      - No digits in observations or implications
      - Regime by the sign of net_gex; near_zero always rejected
      - Evidence paths resolve (entailment is not checked)
      - No explicit trading recommendation (pattern-based, D-6)
      - Snapshot integrity and freshness, fail-closed
      - Not checked - that the interpretation follows from the facts beyond numbers and evidence paths (entailment)
    guide: docs/LOCAL-VALIDATION-GEX-INTERACTIVE.md

  - id: regime_interpretation
    kind: interpretation
    serves: Registrar el régimen diario de un símbolo (GEX, skew 25Δ, VIX/VVIX) y evaluarlo después.
    example_requests:
      - Analizá el régimen de hoy de SPY y guardalo.
      - ¿Qué dijimos del régimen la semana pasada y qué pasó?
    skill: skills/regime-analysis/skill.yaml
    output_contract: galecore_ai.contracts.regime_analysis.RegimeInterpretation
    galecore_capabilities: [compute.gex_analysis, compute.put_skew, market_data.trade]
    data_needs:
      - need: GEX de SPY
      - need: put skew de SPY
      - need: VIX
      - need: VVIX
    prepare_skill: regime
    flow:
      - prepare --symbol <SYMBOL> --skill regime
      - accept --record --prompt "<pedido del usuario>" < {run_id, interpretation, host_provider, host_model}
      - record outcome --symbol <SYMBOL> --date <YYYY-MM-DD> [--run-id <run_id>]
      - record review --symbol <SYMBOL> --date <YYYY-MM-DD> --run-id <run_id> --verdict <v> --comment "<owner>"
      - query --symbol <SYMBOL> --since <YYYY-MM-DD>
    stored_as: regime
    controls:
      - The GEX controls, plus tail_pricing equal to GaleCore's put_skew_level_ok
      - Record entry hashed at acceptance; outcomes and reviews appended, never rewritten
      - The review verdict is the owner's (F-6)
      - Daily records only after the cash session (F-2)
      - Not checked - that the regime reading anticipates what happens next; outcomes and reviews exist to judge that
    guide: docs/LOCAL-VALIDATION-REGIME-INTERACTIVE.md

  - id: data_sources
    kind: harness
    serves: >-
      Saber qué fuentes de datos hay disponibles, qué cubre cada una, su costo y
      límites conocidos, su último estado de acceso comprobado y cuál conviene usar
      primero para un dato dado.
    example_requests:
      - ¿Qué datos tengo?
      - ¿De dónde saco la cadena de opciones de SPY?
      - ¿Cuál es el IV rank de NVDA?
      - Traeme las velas diarias de QQQ del último mes
    skill: skills/data-sources/skill.yaml
    output_contract: galecore_ai.contracts.sources.SourceQueryResult
    galecore_capabilities: []
    data_needs: []
    flow:
      - sources list
      - sources query --need "<qué dato hace falta>"
      - galecore list
      - galecore get <capability> --symbol <símbolo> [--param clave=valor] [--out <archivo>]
      - sources check [--source galecore|fred]   # FRED por GaleCore desde WS-0014
      - sources declare --source <id> --state available|denied|limited|down --note "..." --observed-at <ISO8601> --host-model <model> [--category <cat>] [--evidence evidence:<id>]
    stored_as: none
    controls:
      - The registry (config/sources.yaml) rejects a source missing coverage, cost or a probe where one is required
      - GaleCore and FRED (through GaleCore) are checked with a minimal call this code runs; other sources are HOST_DECLARED only
      - "declare requires --observed-at (the moment the access was actually observed, e.g. an evidence item's retrieved_at); it is never the time the command ran"
      - A declared observation never carries a key or token; a cited evidence ref must resolve
      - Status history is append-only; an edited or reordered source's file is reported as integrity_failed, never a crash
      - Query orders matching sources by usage (free, own/GaleCore, daily_quota, plan) then preference, flags daily-quota sources to use only when needed, and shows the most recent status that bears on the matched category, not an unrelated endpoint's; a need with no match is reported missing, never guessed
      - output_contract names SourceQueryResult, the shape `sources query` answers with (the entry's primary output); `sources list` answers with the related SourceCatalogSummary
      - "`galecore get` reaches only capabilities in KNOWN_CAPABILITIES (PURE_QUERY/COMPUTE: read-only); a scheduled run may write --out only inside its own run directory"
      - A need covered only by requested sources (pending in GaleCore) is reported missing, naming who brings it
      - Not checked - whether a source's own data is correct

  - id: trader_space
    kind: harness
    serves: >-
      Tu espacio de trader en GaleCore: perfil, objetivos, convenciones, memoria, skills, agentes y datos, propios o
      compartidos con el equipo. GaleCore-AI lo carga al empezar cada sesión para responder según tus objetivos y
      límites, y guarda lo que le pedís conservar.
    example_requests:
      - ¿Qué sabés de mí y de mis objetivos?
      - Guardá como convención que opero sólo spreads de riesgo definido
      - Acordate de que el NFP me sacó de una posición la semana pasada
      - Compartí con el equipo mi agente de oportunidades
    skill: skills/trader-space/skill.yaml
    output_contract: galecore_ai.contracts.sources.SourceQueryResult
    galecore_capabilities: [App/GaleCore/Space]
    data_needs: []
    flow:
      - space context
      - space list [--kind <tipo>]
      - space show <tipo>/<clave>
      - space put <tipo>/<clave> --title "<título>" [--visibility private|shared] < contenido
      - space delete <tipo>/<clave>
      - space import
    stored_as: none
    controls:
      - "GaleCore keeps it per user: the owner comes from the login token, never from the request; shared pieces from others are read-only"
      - The login comes from GALECORE_USERNAME/GALECORE_PASSWORD or, on GaleCore Dev only, the demo user; no credential is stored by GaleCore-AI
      - A piece's version goes up only when its content changes; `space import` writes only what changed
      - "Not checked - that a piece's content is true or current; it is what the trader (or an import) wrote"

  - id: user_profile
    kind: harness
    serves: >-
      Tus objetivos, capital de referencia, horizonte, drawdown y límites de riesgo,
      fuentes preferidas y formato de entrega, versionados, para que cada capacidad los
      aplique sin que los repitas y deje registrado qué versión usó. También tus criterios
      y tu mandato: utilidad mínima, cuándo es edge y no suerte, qué pasa al tocar un
      límite y qué hace solo el sistema y qué te pide aprobar; te los discute y los deja medibles.
    example_requests:
      - ¿Qué perfil tengo?
      - Revisemos mis objetivos, ¿qué está vago o falta?
      - ¿Qué puede hacer el sistema solo y qué necesita mi aprobación?
      - Mi capital de referencia es 10.000 USD
      - Los informes, tablas y gráficos primero
    skill: skills/user-profile/skill.yaml
    output_contract: galecore_ai.contracts.profile.ProfileVersion
    galecore_capabilities: []
    data_needs: []
    flow:
      - profile show
      - profile review
      - 'profile set --note "<qué cambia>" --prompt "<tus palabras>" --host-model <model> < {"changes": {...}}'
      - profile history
    stored_as: profile
    controls:
      - Create-only versions; every read re-checks the hash, an edited version is INTEGRITY_FAILED and blocks changes
      - Partial changes on top of the current version; no real change creates no version
      - Unknown fields, blank values and sources outside config/sources.yaml are refused
      - Refuses text that looks like a key or token (heuristic, English and Spanish labels plus common key prefixes); a refused value is not echoed back
      - Missing fields are declared, never defaulted; placeholders the user asked for are listed in `provisional` and reported as such
      - "`profile review` flags criteria that are missing, have no number (objectives, drawdown, limits, minimum return, edge) or are provisional, and lists each strategy's pending parameters and owner decisions; it proposes nothing by code, the user decides"
      - Fields added later stay out of the hash while empty, so earlier versions keep verifying
      - "While a profile exists, research and context_research refuse to save unless an antecedent cites the version in force (profile:v<N>), so the stored revision records the version (hash) used"
      - "Consumers today: research, context_research, strategy_followup and daily_attention; GEX, regime, strategy design and tasks do not read the profile yet"
      - Not checked - whether the declared objectives or limits are sensible

  - id: capability_builder
    kind: harness
    serves: >-
      Crear una capacidad nueva con el molde: qué pedido atiende, qué datos necesita y de qué fuentes
      registradas salen, qué entrega y dónde se guarda, con qué comandos corre y qué controles tiene,
      y declarar lo que no se pudo completar.
    example_requests:
      - Quiero una capacidad que me diga qué merece mi atención hoy.
      - Armá una skill de reporte macro para ver los eventos de la semana.
      - Le faltó el calendario de la Fed.
      - ¿Qué feedback quedó pendiente?
    skill: skills/capability-builder/skill.yaml
    output_contract: galecore_ai.harness.catalog.CatalogEntry
    galecore_capabilities: []
    data_needs: []
    flow:
      - catalog
      - sources query --need "<dato>"
      - profile show
      - catalog --check
      - feedback add --research research:<id> --revision <N> --classification <kind> --slug <slug> --prompt "<pedido>"
      - feedback list
    stored_as: none
    controls:
      - "catalog --check rejects an entry whose skill or contract does not load, whose flow names a command this CLI does not have (or a script not in the workspace), whose data need no registered source covers without a declared reason, or whose controls do not say what is not checked"
      - A result stored as research must cite the profile in force (enforced when saving)
      - "feedback add rejects a result or revision that does not exist and takes the skill and version from that revision; written once, hashed"
      - "A profile version or skill history may only cite feedback of its kind (preference / method), and a skill version only feedback about an earlier version of that skill; feedback list counts as applied only a citation where its kind belongs"
      - Not checked - that the classification is right or that the correction does what the comment asked; the next run shows it
      - Not checked - that the capability is useful or that its method is right; that is judged by running it
      - Not checked - the options and arguments of each flow line (only the command and subcommand)

  - id: research
    kind: investigation
    serves: >-
      Investigar una idea con los antecedentes disponibles (registros, investigaciones previas,
      archivos locales), producir una hipótesis y un plan de prueba con fuentes y limitaciones,
      conservarlos y retomarlos en otra sesión.
    example_requests:
      - Investigá si el 0DTE vencido distorsiona el GEX post-cierre y cómo lo probaríamos.
      - Retomá la investigación sobre el GEX post-cierre.
    skill: skills/research/skill.yaml
    output_contract: galecore_ai.contracts.research.ResearchContent
    galecore_capabilities: []
    data_needs: []
    flow:
      - kb search --text "<términos>" [--kind research|regime] [--status unfinished]
      - kb show <ref>
      - research save --slug <slug> --prompt "<pedido del usuario>" < {content, host_provider, host_model}
      - research revise --id <id> --reason continuation|correction|result --note "<qué cambia>" --prompt "<pedido>" < {content, host_provider, host_model}
    stored_as: research
    controls:
      - Every antecedent and source resolves to an intact knowledge item or an existing workspace file
      - Every antecedent says how it affects the hypothesis or the plan
      - A statement marked as fact cites at least one source
      - Open or test_planned work lists its next steps; a test plan needs its hypothesis
      - "Revisions are append-only and hashed; an edit that breaks a revision's hash is INTEGRITY_FAILED (removing or consistently rewriting revisions shows only in the knowledge base's git history)"
      - "Knowledge items are cited as regime or research refs; a file ref into the knowledge base is refused"
      - Not checked - whether the reasoning is right, or whether a fact's source supports it

  - id: context_research
    kind: investigation
    serves: >-
      Investigar el contexto de una idea de trading sobre un instrumento y horizonte: qué factores
      importan (tasas, inflación, actividad, beneficios, eventos, opciones…), consultarlos en GaleCore
      y en las fuentes externas del host según haga falta, conservar cada respuesta con su procedencia,
      contrastar escenarios y dejar qué implica para investigar la estrategia, qué falta y cómo probarlo.
    example_requests:
      - Quiero investigar una estrategia sobre SPY. ¿Qué contexto importa para esta idea y horizonte?
      - Retomá la investigación de contexto de SPY e incorporá lo nuevo.
      - Analizame el contexto de mi idea (tasas, macro, eventos) antes de diseñarla.
    skill: skills/context-research/skill.yaml
    output_contract: galecore_ai.contracts.research.ResearchContent
    galecore_capabilities: []
    data_needs:
      - need: curva de tasas
      - need: tasa real
      - need: inflacion
      - need: spread de credito
      - need: calendario de earnings
      - need: VIX
      - need: fecha del FOMC
    flow:
      - kb search --text "<idea, instrumento>" [--kind research|evidence] [--status unfinished]
      - evidence add --slug <fuente-serie> --prompt "<pedido del usuario>" < {content, host_provider, host_model}
      - research save --capability context_research --slug <slug> --prompt "<pedido>" < {content, host_provider, host_model}
      - kb show research:<id>
      - research revise --capability context_research --id <id> --reason result|continuation|correction --note "<qué cambia>" --prompt "<pedido>" < {...}
    stored_as: research
    controls:
      - The research controls, plus every evidence:<id> cited must resolve to an intact evidence item
      - Evidence is create-only and hashed; an edited item is INTEGRITY_FAILED and cannot be cited
      - Evidence provenance is always HOST_DECLARED; parameters that may carry credentials are refused
      - Each revision records the skill (version and hash) of the method followed
      - Not checked - that the payload is what the source returned, that factors were well chosen, or that the scenarios are right

  - id: strategy_design
    kind: strategy
    serves: >-
      Desarrollar una estrategia completa desde su investigación (hipótesis, entrada, construcción,
      sizing, monitoreo, ajustes, salidas, invalidación y plan de evaluación), mapear cada regla a lo
      que el runtime de GaleCore ejecuta, preparar la StrategySpec versionada con el hash de GaleCore,
      registrar la aprobación del owner de esa versión exacta y desplegarla en SHADOW de desarrollo.
    example_requests:
      - Desarrollá esta estrategia hasta SHADOW.
      - ¿Qué le falta a esta estrategia para correr en SHADOW y qué reglas no soporta GaleCore?
      - Quiero probar una estrategia de put credit spreads en SHADOW
      - Tengo una idea de estrategia, armala y ponela a prueba
      - ¿Está bien esta idea? ¿Qué le falta y por qué no?
    skill: skills/strategy-design/skill.yaml
    output_contract: galecore_ai.contracts.strategy.ProposalContent
    galecore_capabilities: [App/Runtime/Specs, App/Runtime/Deploy]
    data_needs:
      - need: cotizaciones de SPY
      - need: posiciones SHADOW
      - need: velas de SPY
      - need: historicos de SPY con disponibilidad point-in-time
        missing: "las velas de GaleCore (galecore get market_data.candles) son precios, no una historia point-in-time con dividendos y revisiones; el backtest GC-AI-0011 sigue suspendido"
      - need: IV rank de SPY
    flow:
      - kb search --text "<idea>" [--kind research|evidence|strategy]
      - research save --slug <slug> --prompt "<pedido>" < {content, host_provider, host_model}   # si la estrategia no tiene investigación propia
      - strategy check --spec <GaleCore Files/Runtime/<name>.json> < {content}
      - strategy save --spec <file> --prompt "<pedido>" < {content, host_provider, host_model}
      - strategy critique --ref strategy:<name>/<version> < {content, host_provider, host_model}   # el crítico, antes de pedir la aprobación
      - strategy sheet --ref strategy:<name>/<version>   # la ficha de una página para el owner
      - strategy approve --ref strategy:<name>/<version> --spec-hash <hash> --owner-words "<owner>" --host-model <model>
      - strategy deploy-check --ref strategy:<name>/<version> --galecore-hash <hash de App/Runtime/Specs/<name>>
      - python GaleCore/dev/galecore_dev.py deploy --spec <name> --approval knowledge/strategies/<name>/<version>.approval.json   # sólo GaleCore Dev
    stored_as: strategy
    controls:
      - Every block (entry, construction, sizing, monitoring, adjustment, exit, invalidation) has a rule or a not-applicable rule that says why
      - A grounded rule cites a source; a pending parameter or design choice says its reason
      - Every spec field is in the runtime support table; a field nobody mapped fails the check
      - A field the runtime executes is explained by a supported rule; a supported rule names only fields the runtime executes
      - A field the runtime ignores must hold the value the runtime really behaves as (one contract, no roll, no heat); unsupported rules stay out of the spec, declared
      - The spec hash is GaleCore's (JCS + SHA-256, verified against hashes GaleCore computed); versions and approvals are create-only and hashed
      - Deploy (dev tool) reads the approval file, re-checks the approval's and the proposal's hashes and requires the hash GaleCore loaded; scope SHADOW in GaleCore Dev. GaleCore's Deploy endpoint itself does not check approvals (admin-only, D-0003)
      - A version is saved only with its parameter table (every rule with a parameter in a row) and its management tree (every exit and adjustment rule as a trigger -> action step)
      - A version is approved only with a critique of that exact proposal document, and never with the verdict «descartar»; critiques are create-only and hashed
      - Not checked - that the hypothesis is right, that parameters are good, that the critique is sharp, or that the strategy is profitable

  - id: strategy_followup
    kind: investigation
    serves: >-
      Mostrar la estrategia, qué está ejecutando GaleCore, qué pasó desde la última revisión (entradas,
      descartes, posiciones) y qué merece atención, con datos de GaleCore atados a la versión exacta, y
      guardarlo como registro de seguimiento y revisión de su investigación.
    example_requests:
      - ¿Cómo le fue a mi estrategia en SHADOW?
      - ¿Qué hizo la versión aprobada desde que la desplegamos?
      - Mostrame mi estrategia, qué está ejecutando, qué pasó desde la última revisión y qué merece mi atención.
      - ¿Qué hizo esta estrategia desde la última revisión, por qué entró o no entró, cómo evolucionaron sus posiciones y qué cambia en nuestra hipótesis?
    skill: skills/strategy-followup/skill.yaml
    output_contract: galecore_ai.contracts.research.ResearchContent
    galecore_capabilities: [App/Runtime/Status, App/Runtime/Instances, App/Runtime/Metrics]
    data_needs:
      - need: posiciones SHADOW
      - need: evaluaciones SHADOW
      - need: metricas SHADOW
    flow:
      - followup run --strategy <name> --prompt "<pedido>" --host-model <model>   # lee GaleCore por API; guarda evidencia y registro con hash
      - followup history --strategy <name>
      - research revise --capability strategy_followup --id <investigación> --reason result --note "<qué cambia>" --prompt "<pedido>" < {...}
    stored_as: research
    controls:
      - The research and evidence controls; the runtime report is kept verbatim as evidence
      - Only data of the instance whose version hash equals the approved spec hash
      - Operation, SHADOW results and economic evidence are reported separately; simulated fills are never executions
      - Not checked - that the interpretation of the results is right
    schedulable: {runs: code}

  - id: daily_attention
    kind: investigation
    serves: >-
      Decir qué merece tu atención hoy sobre lo que tenés en SHADOW: exposición de las posiciones frente a
      los límites de tu perfil, qué dicen las reglas de la estrategia aprobada, qué cambió desde la última
      revisión, qué eventos (datos macro, resultados) vienen antes de que venza o salga cada posición, el
      contexto de mercado que importa y qué falta, con fuentes, y guardarlo como revisión de una
      investigación de atención diaria por estrategia.
    example_requests:
      - ¿Qué merece mi atención hoy sobre lo que tengo en SHADOW?
      - ¿Cómo está la exposición y qué dicen las reglas de la estrategia sobre las posiciones abiertas?
      - ¿Qué cambió desde la última revisión y qué contexto importa hoy?
      - ¿Qué evento macro viene y cómo afecta mis posiciones?
    skill: skills/daily-attention/skill.yaml
    output_contract: galecore_ai.contracts.research.ResearchContent
    galecore_capabilities: [App/Runtime/Status, App/Runtime/Instances, App/Runtime/Metrics, compute.gex_analysis, compute.put_skew, market_data.trade, calendar.macro_releases, calendar.fomc_meetings, calendar.treasury_auctions, rates.treasury_curve, history.index_daily]
    data_needs:
      - need: posiciones SHADOW
      - need: evaluaciones SHADOW
      - need: metricas SHADOW
      - need: GEX de SPY
      - need: put skew de SPY
      - need: VIX
      - need: VVIX
      - need: calendario de earnings
      - need: griegas de posiciones SHADOW
        missing: "ninguna fuente registrada las sirve (GaleCore no expone griegas de posiciones SHADOW por el harness)"
      - need: riesgo maximo de posiciones SHADOW
      - need: reuniones del FOMC
      - need: calendario macro
    flow:
      - profile show
      - kb search --kind strategy
      - kb show strategy:<name>/<version>
      - kb search --kind research --text "atencion diaria <strategy>"
      - followup history --strategy <name>
      - followup run --strategy <name> --prompt "<pedido>" --host-model <model>
      - prepare --symbol SPY --skill regime   # contexto GaleCore, sólo lectura
      - sources query --need "<dato>"
      - galecore get <capability> [--param clave=valor] [--out <archivo>]   # calendar.*, rates.treasury_curve, history.index_daily
      - evidence add --slug <fuente-serie> --prompt "<pedido>" < {content, host_provider, host_model}
      - research save --capability daily_attention --slug atencion-diaria-<strategy> --prompt "<pedido>" < {content, host_provider, host_model}
      - research revise --capability daily_attention --id <id> --reason continuation --note "<qué cambia>" --prompt "<pedido>" < {content, host_provider, host_model}
    stored_as: research
    controls:
      - The research, evidence and strategy_followup controls; the runtime report is kept verbatim as evidence
      - Only data of the instance whose version hash equals the approved spec hash
      - A save must cite the profile in force (profile:v<N>); each revision records this skill's version and hash
      - A data need no registered source covers is declared missing, never estimated
      - "Not checked - that exposure is compared against the right limits, that the rules were applied correctly to each position, or that the attention points are the right ones"
      - Not checked - that the events x positions table is present, complete for the range, or reads each event's bearing right; the next run shows it
      - "A scheduled run (recurring_followup) calls the model with only the read commands of this flow and a turn cap; the model returns the content and the evidence, and the runner validates and saves them (invoked_by=scheduler)"
      - "Not checked - that a scheduled briefing is as complete as one made in a session; the run's status (OK, INCOMPLETE, FAILED) says what was missing"
    schedulable: {runs: model, work: reading, max_turns: 40, timeout_minutes: 20}

  - id: market_watch
    kind: investigation
    serves: >-
      Un agente que vigila el mercado con tus instrucciones (qué símbolos, qué condiciones, qué es un hallazgo):
      lee IV rank, estructura de IV, métricas de volatilidad, cadenas y griegas, velas, GEX y el calendario macro,
      evalúa tus condiciones símbolo por símbolo y guarda lo que encontró (candidatos que cumplen, los que quedaron
      cerca y por qué, y qué dato faltó) como revisión de una investigación por agente. Se programa como tarea
      (por ejemplo cada 30 minutos en horario de mercado) o se corre a pedido.
    example_requests:
      - Armame un agente que cada 30 minutos revise SPY, QQQ e IWM y me anote candidatos para put credit spreads cuando el IV rank esté alto
      - Vigilá el mercado y avisame qué símbolos cumplen mis condiciones
      - ¿Qué encontró hoy mi agente de oportunidades?
      - ¿Hay algo para vender prima esta semana en SPY o QQQ?
      - ¿Dónde hay una oportunidad de put credit spread hoy?
    skill: skills/market-watch/skill.yaml
    output_contract: galecore_ai.contracts.research.ResearchContent
    galecore_capabilities: [compute.iv_rank, compute.implied_volatility, market_data.volatility_metrics, market_data.option_chains, market_data.option_greeks, market_data.candles, calendar.macro_releases, calendar.fomc_meetings, compute.gex_analysis, compute.put_skew, history.index_daily, rates.treasury_curve]
    data_needs:
      - need: IV rank de SPY
      - need: cadena de opciones de SPY
      - need: velas de SPY
      - need: calendario macro
    flow:
      - profile show
      - kb search --kind research --text "<agent slug>"
      - galecore list
      - galecore get <capability> --symbol <símbolo> [--param clave=valor] [--out <archivo>]
      - prepare --symbol <símbolo> --skill regime
      - sources query --need "<dato>"
      - evidence add --slug <fuente-serie> --prompt "<pedido>" < {content, host_provider, host_model}
      - research save --capability market_watch --slug <agent slug> --prompt "<pedido>" < {content, host_provider, host_model}
      - research revise --capability market_watch --id <id> --reason continuation --note "<qué cambia>" --prompt "<pedido>" < {content, host_provider, host_model}
    stored_as: research
    controls:
      - The research and evidence controls; every reported number comes from a stored response
      - A save must cite the profile in force (profile:v<N>); each revision records this skill's version and hash
      - "Read-only: a candidate is described, never advised (the runner refuses advice addressed to the reader); no orders"
      - A condition that cannot be evaluated with the data available is declared not evaluated, never assumed met
      - "A scheduled run calls the model (sonnet) with only the read commands of this flow and a turn cap; the runner validates and saves the result"
      - "With a screen (`task set-scan`), each run first checks by code the IV rank of each symbol and the quiet window of releases; the model is called only with a finding, and a screen that could not run never calls it (P1-05)"
      - "Not checked - that the owner's conditions were applied correctly or that a candidate is a good trade"
    schedulable: {runs: model, work: reading, max_turns: 25, timeout_minutes: 12}

  - id: market_story
    kind: investigation
    serves: >-
      La historia que está priceando el mercado y si cambió: qué activo lidera y cuál queda atrás, si tasas, dólar y
      crédito confirman o contradicen a las acciones, si la volatilidad pricea calma o estrés, qué cobran las opciones
      por protegerse y qué pagan por venderlas, qué eventos del calendario pueden moverla, la historia competidora y
      qué la decidiría. Junta los datos el código (sin modelo) y los interpreta el modelo; cada lectura queda como
      revisión de una investigación por símbolo y se compara con la anterior. Corre sola después del cierre o a pedido.
    example_requests:
      - ¿Qué historia está priceando el mercado?
      - ¿Cambió la historia del mercado?
      - ¿Qué está descontando hoy el mercado?
      - Contame qué narrativa hay detrás de los precios de hoy
      - ¿El mercado está priceando calma o miedo?
    skill: skills/market-story/skill.yaml
    output_contract: galecore_ai.contracts.research.ResearchContent
    galecore_capabilities: [market_data.candles, compute.put_skew, compute.implied_volatility, compute.iv_rank, market_data.volatility_metrics, compute.gex_analysis, calendar.macro_releases, calendar.fomc_meetings]
    data_needs:
      - need: velas de SPY
      - need: velas de TLT
      - need: put skew de SPY
      - need: IV rank de SPY
      - need: GEX de SPY
      - need: calendario macro
      - need: noticias del mercado
        missing: ninguna fuente registrada cubre noticias en una corrida programada; en sesión, Alpha Vantage NEWS_SENTIMENT sin probar (inventory)
    flow:
      - story pack --symbol <SYMBOL> --prompt "<pedido>"
      - profile show
      - kb search --kind research --text "historia del mercado"
      - kb show <ref>
      - research save --capability market_story --slug historia-del-mercado-<symbol> --prompt "<pedido>" < {content, host_provider, host_model}
      - research revise --capability market_story --id <id> --reason continuation --note "<qué cambia>" --prompt "<pedido>" < {content, host_provider, host_model}
    stored_as: research
    controls:
      - "The pack is gathered by code from GaleCore (no model): one call per capability, changes and term ratios computed here, a failed call declared in missing, never estimated"
      - The pack is kept as one evidence item and compared with the previous pack of the symbol (moves and sign flips)
      - The research controls; every reported number cites the pack; a save must cite the profile in force
      - "A scheduled run: the runner gathers the pack, then the model (opus) reads it with only read commands and a turn cap; the runner validates and saves"
      - "Read-only: describes, never advises (the runner refuses advice addressed to the reader); no orders"
      - "Not checked - that the story is right or anticipates anything; the next readings and the owner's feedback exist to judge that"
    schedulable: {runs: model, work: interpretation, max_turns: 12, timeout_minutes: 15}

  - id: on_demand_analysis
    kind: investigation
    serves: >-
      Análisis a pedido desde los datos de GaleCore: la macro (tasas, curva, tasa real y breakevens, crédito, fed funds,
      CPI, empleo y la cadena de transmisión), el técnico de un símbolo (tendencia, niveles, volatilidad realizada
      contra IV), el fundamental de una empresa (ingresos, resultado, EPS, crecimiento, P/E contra lo reportado,
      últimas presentaciones a la SEC) y el flow de opciones (GEX, walls, skew, estructura de IV). Cada lectura separa
      hecho, cálculo, estimación e hipótesis, con alternativa e invalidación; consenso y estimaciones de analistas se
      declaran faltantes. Junta el código, interpreta el modelo.
    example_requests:
      - Explicame la macro
      - ¿Cómo están las tasas largas, los breakevens y el empleo?
      - Análisis técnico de QQQ
      - Analizame NVDA
      - El flow de opciones de SPY
    skill: skills/on-demand-analysis/skill.yaml
    output_contract: galecore_ai.contracts.research.ResearchContent
    galecore_capabilities: [macro.fred_series, macro.bls_series, market_data.candles, filings.sec_facts, filings.sec_filings, market_data.volatility_metrics, market_data.quote, compute.put_skew, compute.implied_volatility, compute.iv_rank, compute.gex_analysis]
    data_needs:
      - need: curva de tasas
      - need: inflacion
      - need: spread de credito
      - need: velas
      - need: fundamentales XBRL
      - need: consenso de datos macro
        missing: ninguna fuente registrada trae consenso ni estimaciones de analistas
    flow:
      - analyze pack --kind macro|technical|fundamental|flow [--symbol SYM] --prompt "<pedido>"
      - profile show
      - kb search --kind research --text "<análisis, símbolo>"
      - kb show <ref>
      - research save --capability on_demand_analysis --slug analisis-<kind>-<symbol> --prompt "<pedido>" < {content, host_provider, host_model}
      - research revise --capability on_demand_analysis --id <id> --reason continuation --note "<qué cambia>" --prompt "<pedido>" < {content, host_provider, host_model}
    stored_as: research
    controls:
      - "The pack is gathered by code from GaleCore (no model); descriptive numbers computed here and labelled; a failed call or a source that does not exist is declared in missing"
      - The pack is kept as one evidence item and points at the previous one of the same kind and symbol
      - The research controls; every reported number cites the pack; a save must cite the profile in force
      - "Not checked - that the reading is right; consensus and estimates are missing, so surprises are not measured"

  - id: recurring_followup
    kind: task
    serves: >-
      Delegar un seguimiento: convertirlo en una tarea recurrente (objetivo, frecuencia, zona horaria, fuentes,
      resultado esperado) que corre sola en el Programador de tareas de Windows, y gestionarla desde el chat:
      estado, último resultado e historial, cambiar frecuencia, pausar, reanudar, cancelar.
    example_requests:
      - Hacé este seguimiento diariamente y guardalo.
      - Mostrame el último resultado y el historial.
      - Cambiá la frecuencia.
      - Pausalo. / Cancelalo.
    skill: skills/recurring-followup/skill.yaml
    output_contract: galecore_ai.contracts.task.TaskDefinition
    galecore_capabilities: [App/Runtime/Status, App/Runtime/Instances, App/Runtime/Metrics]
    data_needs:
      - need: posiciones SHADOW
      - need: evaluaciones SHADOW
      - need: metricas SHADOW
    flow:
      - task create --id <id> [--capability <schedulable id>] --strategy <name> --objective "<qué querés saber>" --expected "<resultado>" --source "<fuente>" --frequency daily --time 17:05 --timezone America/New_York --prompt "<pedido>"
      - task status <id>
      - task history <id>
      - task set-frequency <id> --frequency <...> [--time HH:MM | --minutes N] --timezone <tz> --prompt "<pedido>"
      - task pause <id> --prompt "<pedido>" · task resume <id> --prompt "<pedido>" · task cancel <id> --prompt "<pedido>"
    stored_as: task
    controls:
      - A task runs only a capability declared schedulable in this catalog (read-only; `catalog --check` refuses one whose flow writes beyond its own result); it cannot write strategy versions, approvals, deployments or the profile
      - A model run has a turn cap and a time cap from the catalog; its duration and outcome (OK, INCOMPLETE, FAILED with the reason) go to the events log
      - One run at a time (exclusive lock; a stale lock is broken and noted); a paused or cancelled task never runs
      - Every change and run is appended to a hash-chained events log; each run leaves a hashed follow-up record naming the task, the strategy version and its sources
      - Runs depend on the PC on, the user logged on, GaleCore Dev's API up and its credentials; failures are recorded, never silent
      - Not checked - that the schedule suits the owner, or the interpretation of each result

  - id: watch_alerts
    kind: harness
    serves: >-
      Dejar una alerta pedida en tus palabras («avisame si SPY baja a 760», «si cruza el gamma cero») que el
      supervisor revisa por código cada 5 minutos en la sesión regular y avisa una vez, con sonido, en el monitor. El
      modelo sólo traduce el pedido y guarda la regla; nunca vigila. Ver y cancelar las alertas.
    example_requests:
      - Avisame si SPY baja a 760.
      - Seteame una alerta si el SPY pasa 790.
      - Alertame si SPY cruza para abajo el nivel gamma cero de 771.
      - ¿Qué alertas tengo?
      - Sacá la alerta de SPY.
    skill: skills/watch-alerts/skill.yaml
    output_contract: galecore_ai.contracts.supervision.WatchRule
    galecore_capabilities: [Data/Tastytrade/MarketData/Quote, App/Gex/Analysis, App.Analytics/IVRank]
    data_needs:
      - need: cotizacion
      - need: GEX de SPY
      - need: IV rank de SPY
    flow:
      - supervise watch --symbol <SYM> [--metric price|gamma_zero|call_wall|put_wall|iv_rank] --below|--above <nivel> --text "<tus palabras>" --prompt "<pedido>"
      - supervise watches
      - supervise unwatch <id> --prompt "<pedido>"
    stored_as: supervision
    controls:
      - The rule keeps the owner's words and request; it is create-only and hashed, an edited one is INTEGRITY_FAILED and stops the pass
      - Evaluated by code in the supervisor's pass, only in the regular session; it alerts once (key watch:<rule>) and then is met
      - A number GaleCore cannot give (no quote, NaN, a cold GEX past the timeout) is a problem of the pass, never «not met»
      - "Not checked - NYSE holidays (a holiday has no quotes: the pass reports a problem); prices between two 5-minute passes"

  - id: performance_review
    kind: investigation
    serves: >-
      Decir cómo viene cada estrategia y la cartera contra tu objetivo: performance por estrategia, versión y regla de
      salida, retorno contra el capital de referencia, la utilidad mínima y el objetivo, si es edge o suerte según tu
      criterio, la revisión de cada operación cerrada (qué regla actuó, planeado contra ocurrido, diagnóstico observado
      o hipótesis) y tus decisiones (qué esperábamos y qué pasó). También el resumen de la semana de la cartera.
    example_requests:
      - ¿Cómo viene la estrategia? ¿Dónde falla y por qué?
      - ¿Cuánto rinde mi cartera contra mi objetivo?
      - ¿Esto es edge o suerte?
      - ¿Qué aprendemos de la última operación cerrada?
      - ¿Qué esperábamos cuando decidimos, qué ocurrió y qué corresponde revisar?
      - Resumime la semana de mi cartera.
    skill: skills/performance-review/skill.yaml
    output_contract: galecore_ai.contracts.research.ResearchContent
    galecore_capabilities: [App/Runtime/Performance]
    data_needs:
      - need: performance SHADOW
    flow:
      - performance [--strategy <name>] [--since <YYYY-MM-DD>]   # GaleCore calcula; el código lo pone contra el perfil y las decisiones
      - supervise list
      - story pack
      - profile show
    stored_as: none
    controls:
      - "Numbers come from GaleCore App/Runtime/Performance; the code only compares them with the profile's numbers, read from its words (what cannot be read is listed in criterios.no_leidos, never guessed)"
      - "Edge: below the profile's sample (closes and days) the conclusion is «sin edge demostrado» whatever the result"
      - "A close's diagnosis separates observado (rule of the profile not respected, fill worse than its rule's level beyond max(2 USD, 10 % of the credit)) from hipotesis (a loss inside the plan: thesis to review only if it repeats)"
      - "Not checked - costs (SHADOW fills at mid, no commissions), comparison against cash (no risk-free rate in the report), positions closed before persistence existed"

  - id: capital_risk
    kind: investigation
    serves: >-
      Decir qué capital tenés disponible u ocioso sobre el capital de referencia, si estás concentrado (varias
      posiciones chicas del mismo subyacente, dirección y semana de vencimiento son una sola apuesta) contra tus
      límites, y cómo repartir un capital («tengo X USD»): reserva, riesgo por operación, riesgo abierto máximo,
      tope por apuesta, escalera de entradas y diversificación, justificado y nunca como orden.
    example_requests:
      - Tengo 5.000 USD, ¿qué hago?
      - ¿Cómo reparto 10.000 USD entre mis estrategias?
      - ¿Qué capital tengo disponible u ocioso?
      - ¿Estoy concentrado?
      - ¿Varias posiciones chicas son una sola apuesta?
      - ¿Cuánto riesgo tengo abierto contra mis límites?
    skill: skills/capital-risk/skill.yaml
    output_contract: galecore_ai.contracts.research.ResearchContent
    galecore_capabilities: [App/Runtime/Exposure, App/Runtime/Allocation]
    data_needs:
      - need: exposición y reparto SHADOW
    flow:
      - capital [--amount <USD>] [--strategy <name>]   # GaleCore calcula; el código le pasa los % del perfil
      - profile show
    stored_as: none
    controls:
      - "Numbers come from GaleCore App/Runtime/Exposure and App/Runtime/Allocation; the limits are the profile's percentages, read from its words (a missing one stops with MISSING_LIMITS, never guessed); with another capital the same percentages apply to it (owner, 06/10)"
      - "A bet is same underlying, direction and ISO expiry week; one bet is capped at the profile's % of the allowed open risk, and the ladder keeps each week under it"
      - "The split is never an order: a narrower width is a new version with approval; waiting in cash is always an alternative"
      - "Not checked - real account (no broker: on the reference capital), correlation between underlyings, costs, holidays in the ladder"

  - id: alert_analysis
    kind: harness
    serves: >-
      «Analizá este aviso»: desde un aviso del supervisor, el botón del monitor abre Claude Code en su terminal con el
      pedido (P1-01c) y se sigue por chat. El código arma el contexto — el aviso y su regla, la posición si la hay, las
      salidas y el límite de la estrategia y los números de ahora en GaleCore — y la sesión dice qué significa el aviso
      ahora, sin aconsejar. `supervise analyze` queda como corrida suelta que guarda el análisis.
    example_requests:
      - Analizá este aviso.
      - ¿Qué significa el aviso de SPY que me llegó?
      - Explicame el aviso de la posición cerca del stop.
    skill: skills/alert-analysis/skill.yaml
    output_contract: galecore_ai.contracts.supervision.AlertAnalysis
    galecore_capabilities: [Data/Tastytrade/MarketData/Quote, App/Gex/Analysis, App.Analytics/IVRank, App/Runtime/Instances]
    data_needs:
      - need: cotizacion
      - need: GEX de SPY
      - need: IV rank de SPY
    flow:
      - supervise list
      - supervise context <alert id>
      - supervise analyze <alert id> --prompt "<pedido>"
      - supervise analyses
    stored_as: supervision
    controls:
      - The code gathers the context (no model); a source GaleCore does not give is listed as missing, never filled in
      - "The model runs with no tools, on the policy's model for reading work (sonnet, GC-AI-0025), with a turn and time cap"
      - The runner refuses advice addressed to the reader (same patterns as a scheduled run) after one correction round
      - One done analysis per alert, create-only and hashed; a failed one says why and can be asked again
      - "Not checked - that the reading is right; it describes what the numbers say, the decision is the owner's"

  - id: idea_inbox
    kind: harness
    serves: >-
      Anotar una idea tuya en el momento, con tus palabras, sin cortar lo que estamos haciendo ni evaluarla, y
      revisarla después: cada idea termina en el roadmap, en el backlog, en un work item, hecha o descartada, con el
      motivo.
    example_requests:
      - "Anotá esto: probar la estrategia con acciones en vez de opciones."
      - ¿Qué hay en el buzón?
      - Revisemos el buzón.
    skill: skills/idea-inbox/skill.yaml
    output_contract: galecore_ai.contracts.inbox.InboxItem
    galecore_capabilities: []
    data_needs: []
    flow:
      - inbox add --text "<tus palabras>" [--context "<qué estábamos haciendo>"] [--ref <ref>]
      - inbox list [--status pending]
      - inbox show <id>
      - inbox resolve <id> --to roadmap|backlog:BL-NNN|work-item:<id>|done|discarded --note "<por qué>" --prompt "<tus palabras>"
    stored_as: inbox
    controls:
      - The idea is kept verbatim with when and what we were doing; the noted part is hashed and an edit is INTEGRITY_FAILED
      - References must resolve; text that looks like a key or token is refused
      - A review appends where the idea went and why; a backlog item or work item must exist; nothing is deleted
      - Reviews are hash-chained to the idea; rewriting one or removing an earlier one is INTEGRITY_FAILED
      - Text that looks like a key or token is refused in every field (words, context, request, review note)
      - "Not checked - that the most recent reviews were not removed by hand: the file alone cannot show it; the knowledge base's git history does"
      - "Not checked - that the idea is good or that the destination chosen in the review is the right one"

  - id: strategy_project
    kind: harness
    serves: >-
      Trabajar «en la estrategia X» o «en mi cartera» con todo cargado: tesis, reglas y parámetros de la versión
      vigente, versiones y aprobaciones, último seguimiento, investigaciones con sus pendientes, decisiones, feedback y
      en qué historia del mercado funciona; y guardar en tus palabras lo que no tenía lugar (tesis, historia,
      decisiones, pendientes). La cartera suma el perfil vigente (el del espacio en GaleCore) y el estado de cada
      estrategia.
    example_requests:
      - Estemos en la estrategia spy_prima_varianza.
      - Abrí mi cartera.
      - ¿Qué tengo pendiente en la estrategia de prima de varianza?
      - "Decisión para la estrategia: no operar con VIX arriba de 30."
      - ¿En qué historia del mercado funciona esta estrategia?
    skill: skills/strategy-project/skill.yaml
    output_contract: galecore_ai.contracts.project.ProjectLog
    galecore_capabilities: []
    data_needs: []
    flow:
      - project show strategy:<name>
      - project show portfolio
      - project add <name>|portfolio --kind thesis|story|decision|pending|done --text "<tus palabras>" [--ref <ref>] [--closes <hash>] --prompt "<pedido>"
      - space pull-profile
    stored_as: project
    controls:
      - Every item of the view carries its reference; nothing is copied, what is missing is declared
      - The owner's entries are kept verbatim, hash-chained and append-only; an edit is INTEGRITY_FAILED
      - References must resolve; a strategy project needs the strategy to exist; done must close an open item
      - The portfolio's profile is the space's (GaleCore rules); an edit made in the monitor is not overwritten by an import and is declared until pulled; without GaleCore the local profile is shown as unconfirmed
      - "Not checked - live open risk: the view shows what the last follow-up reported, with its date"
      - "Not checked - that the thesis or the story is right"

  - id: daily_contrast
    kind: investigation
    serves: >-
      Cruzar la historia que pricea hoy el mercado con cada estrategia (en qué historia funciona, tus decisiones, su
      estado en SHADOW), con qué mueve hoy al subyacente (datos que vienen y lo que paga la IV) y con la cartera
      (perfil y límites): qué conviene prender, mantener, esperar o apagar en SHADOW, por qué y qué lo cambiaría, e
      ideas nuevas. Propone; decidís vos. Junta los datos el código y lo interpreta el modelo.
    example_requests:
      - ¿Prendo o apago algo hoy?
      - ¿Mis estrategias encajan con la historia de hoy?
      - Contrastá la historia del mercado con mi cartera.
      - ¿Qué conviene prender o apagar en SHADOW según el contexto?
    skill: skills/daily-contrast/skill.yaml
    output_contract: galecore_ai.contracts.research.ResearchContent
    galecore_capabilities: []
    data_needs: []
    flow:
      - contrast pack [--symbol SPY]
      - capital
      - research save --capability daily_contrast --slug contraste-diario --prompt "<pedido>" < {content, host_provider, host_model}
      - research revise --capability daily_contrast --id <investigación> --reason continuation --note "<qué cambia>" --prompt "<pedido>" < {...}
      - project add <name> --kind decision --text "<tu decisión>" --prompt "<pedido>"
    stored_as: research
    controls:
      - The pack is built by code from stored items, each with its reference; a stale story or a strategy without its story is declared
      - The research controls apply to the reading (cited refs resolve, facts cite a source, the profile in force is cited)
      - Each proposal is one of prender | mantener | esperar | apagar | sin datos and says «qué la cambiaría» (refused otherwise)
      - Proposals only; nothing is deployed, paused or changed here; the owner's decision is kept in the strategy's project
      - "Not checked - that the proposal is right; that the story read is still the market's"
