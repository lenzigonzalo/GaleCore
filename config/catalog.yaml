# What the host can ask GaleCore-AI for. `python -B -m galecore_ai.adapters.cli catalog` prints
# this with the version and hash of each skill as loaded. Start here, not from a table in prose.
#
# Adding a capability: add an entry here and its skill asset under skills/. Anything the entry's
# flow needs that does not exist yet (a prepare function, a validator, a store, a command) is code;
# the entry names the commands, so what was declared and what was programmed stays visible.
catalog_version: "1"
entries:
  - id: gex_interpretation
    kind: interpretation
    serves: Interpretar la exposición gamma (GEX) actual de un símbolo con datos de GaleCore.
    example_requests:
      - Analizá el GEX actual de SPY.
    skill: skills/gex-analysis/skill.yaml
    output_contract: galecore_ai.contracts.gex_analysis.GexInterpretation
    galecore_capabilities: [compute.gex_analysis]
    prepare_skill: gex
    flow:
      - prepare --symbol <SYMBOL> --skill gex
      - accept < {run_id, interpretation, host_provider, host_model}
    stored_as: none
    controls:
      - Numbers only in quantitative_claims, each equal to a GaleCore fact with its unit
      - No digits in observations or implications
      - Regime by the sign of net_gex; near_zero always rejected
      - Evidence paths resolve (entailment is not checked)
      - No explicit trading recommendation (pattern-based, D-6)
      - Snapshot integrity and freshness, fail-closed
    guide: docs/LOCAL-VALIDATION-GEX-INTERACTIVE.md

  - id: regime_interpretation
    kind: interpretation
    serves: Registrar el régimen diario de un símbolo (GEX, skew 25Δ, VIX/VVIX) y evaluarlo después.
    example_requests:
      - Analizá el régimen de hoy de SPY y guardalo.
      - ¿Qué dijimos del régimen la semana pasada y qué pasó?
    skill: skills/regime-analysis/skill.yaml
    output_contract: galecore_ai.contracts.regime_analysis.RegimeInterpretation
    galecore_capabilities: [compute.gex_analysis, compute.put_skew, market_data.trade]
    prepare_skill: regime
    flow:
      - prepare --symbol <SYMBOL> --skill regime
      - accept --record --prompt "<pedido del usuario>" < {run_id, interpretation, host_provider, host_model}
      - record outcome --symbol <SYMBOL> --date <YYYY-MM-DD> [--run-id <run_id>]
      - record review --symbol <SYMBOL> --date <YYYY-MM-DD> --run-id <run_id> --verdict <v> --comment "<owner>"
      - query --symbol <SYMBOL> --since <YYYY-MM-DD>
    stored_as: regime
    controls:
      - The GEX controls, plus tail_pricing equal to GaleCore's put_skew_level_ok
      - Record entry hashed at acceptance; outcomes and reviews appended, never rewritten
      - The review verdict is the owner's (F-6)
      - Daily records only after the cash session (F-2)
    guide: docs/LOCAL-VALIDATION-REGIME-INTERACTIVE.md

  - id: research
    kind: investigation
    serves: >-
      Investigar una idea con los antecedentes disponibles (registros, investigaciones previas,
      archivos locales), producir una hipótesis y un plan de prueba con fuentes y limitaciones,
      conservarlos y retomarlos en otra sesión.
    example_requests:
      - Investigá si el 0DTE vencido distorsiona el GEX post-cierre y cómo lo probaríamos.
      - Retomá la investigación sobre el GEX post-cierre.
    skill: skills/research/skill.yaml
    output_contract: galecore_ai.contracts.research.ResearchContent
    galecore_capabilities: []
    flow:
      - kb search --text "<términos>" [--kind research|regime] [--status unfinished]
      - kb show <ref>
      - research save --slug <slug> --prompt "<pedido del usuario>" < {content, host_provider, host_model}
      - research revise --id <id> --reason continuation|correction|result --note "<qué cambia>" --prompt "<pedido>" < {content, host_provider, host_model}
    stored_as: research
    controls:
      - Every antecedent and source resolves to an intact knowledge item or an existing workspace file
      - Every antecedent says how it affects the hypothesis or the plan
      - A statement marked as fact cites at least one source
      - Open or test_planned work lists its next steps; a test plan needs its hypothesis
      - "Revisions are append-only and hashed; an edit that breaks a revision's hash is INTEGRITY_FAILED (removing or consistently rewriting revisions shows only in the knowledge base's git history)"
      - "Knowledge items are cited as regime or research refs; a file ref into the knowledge base is refused"
      - Not checked - whether the reasoning is right, or whether a fact's source supports it

  - id: context_research
    kind: investigation
    serves: >-
      Investigar el contexto de una idea de trading sobre un instrumento y horizonte: qué factores
      importan (tasas, inflación, actividad, beneficios, eventos, opciones…), consultarlos en GaleCore
      y en las fuentes externas del host según haga falta, conservar cada respuesta con su procedencia,
      contrastar escenarios y dejar qué implica para investigar la estrategia, qué falta y cómo probarlo.
    example_requests:
      - Quiero investigar una estrategia sobre SPY. ¿Qué contexto importa para esta idea y horizonte?
      - Retomá la investigación de contexto de SPY e incorporá lo nuevo.
    skill: skills/context-research/skill.yaml
    output_contract: galecore_ai.contracts.research.ResearchContent
    galecore_capabilities: []
    flow:
      - kb search --text "<idea, instrumento>" [--kind research|evidence] [--status unfinished]
      - evidence add --slug <fuente-serie> --prompt "<pedido del usuario>" < {content, host_provider, host_model}
      - research save --capability context_research --slug <slug> --prompt "<pedido>" < {content, host_provider, host_model}
      - kb show research:<id>
      - research revise --capability context_research --id <id> --reason result|continuation|correction --note "<qué cambia>" --prompt "<pedido>" < {...}
    stored_as: research
    controls:
      - The research controls, plus every evidence:<id> cited must resolve to an intact evidence item
      - Evidence is create-only and hashed; an edited item is INTEGRITY_FAILED and cannot be cited
      - Evidence provenance is always HOST_DECLARED; parameters that may carry credentials are refused
      - Each revision records the skill (version and hash) of the method followed
      - Not checked - that the payload is what the source returned, that factors were well chosen, or that the scenarios are right

  - id: strategy_design
    kind: strategy
    serves: >-
      Desarrollar una estrategia completa desde su investigación (hipótesis, entrada, construcción,
      sizing, monitoreo, ajustes, salidas, invalidación y plan de evaluación), mapear cada regla a lo
      que el runtime de GaleCore ejecuta, preparar la StrategySpec versionada con el hash de GaleCore,
      registrar la aprobación del owner de esa versión exacta y desplegarla en SHADOW de desarrollo.
    example_requests:
      - Desarrollá esta estrategia hasta SHADOW.
      - ¿Qué le falta a esta estrategia para correr en SHADOW y qué reglas no soporta GaleCore?
    skill: skills/strategy-design/skill.yaml
    output_contract: galecore_ai.contracts.strategy.ProposalContent
    galecore_capabilities: [App/Runtime/Specs, App/Runtime/Deploy]
    flow:
      - kb search --text "<idea>" [--kind research|evidence|strategy]
      - research save --slug <slug> --prompt "<pedido>" < {content, host_provider, host_model}   # si la estrategia no tiene investigación propia
      - strategy check --spec <GaleCore Files/Runtime/<name>.json> < {content}
      - strategy save --spec <file> --prompt "<pedido>" < {content, host_provider, host_model}
      - strategy approve --ref strategy:<name>/<version> --spec-hash <hash> --owner-words "<owner>" --host-model <model>
      - strategy deploy-check --ref strategy:<name>/<version> --galecore-hash <hash de App/Runtime/Specs/<name>>
      - python GaleCore/dev/galecore_dev.py deploy --spec <name> --approval knowledge/strategies/<name>/<version>.approval.json   # sólo GaleCore Dev
    stored_as: strategy
    controls:
      - Every block (entry, construction, sizing, monitoring, adjustment, exit, invalidation) has a rule or a not-applicable rule that says why
      - A grounded rule cites a source; a pending parameter or design choice says its reason
      - Every spec field is in the runtime support table; a field nobody mapped fails the check
      - A field the runtime executes is explained by a supported rule; a supported rule names only fields the runtime executes
      - A field the runtime ignores must hold the value the runtime really behaves as (one contract, no roll, no heat); unsupported rules stay out of the spec, declared
      - The spec hash is GaleCore's (JCS + SHA-256, verified against hashes GaleCore computed); versions and approvals are create-only and hashed
      - Deploy (dev tool) reads the approval file, re-checks the approval's and the proposal's hashes and requires the hash GaleCore loaded; scope SHADOW in GaleCore Dev. GaleCore's Deploy endpoint itself does not check approvals (admin-only, D-0003)
      - Not checked - that the hypothesis is right, that parameters are good, or that the strategy is profitable

  - id: strategy_followup
    kind: investigation
    serves: >-
      Responder qué hizo una estrategia en SHADOW desde la última revisión, por qué entró o no, cómo
      evolucionaron sus posiciones y qué cambia en la hipótesis, con datos de GaleCore atados a la
      versión aprobada, y guardarlo como revisión de su investigación.
    example_requests:
      - ¿Qué hizo esta estrategia desde la última revisión, por qué entró o no entró, cómo evolucionaron sus posiciones y qué cambia en nuestra hipótesis?
    skill: skills/strategy-followup/skill.yaml
    output_contract: galecore_ai.contracts.research.ResearchContent
    galecore_capabilities: [App/Runtime/Instances, App/Runtime/Metrics]
    flow:
      - kb show strategy:<name>/<version>
      - python GaleCore/dev/galecore_dev.py runtime-report --spec <name>   # sólo lectura, GaleCore Dev
      - evidence add --slug <strategy>-shadow-<fecha> --prompt "<pedido>" < {content con la salida exacta}
      - research revise --capability strategy_followup --id <investigación> --reason result --note "<qué cambia>" --prompt "<pedido>" < {...}
    stored_as: research
    controls:
      - The research and evidence controls; the runtime report is kept verbatim as evidence
      - Only data of the instance whose version hash equals the approved spec hash
      - Operation, SHADOW results and economic evidence are reported separately; simulated fills are never executions
      - Not checked - that the interpretation of the results is right
