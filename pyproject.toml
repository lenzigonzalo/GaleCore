[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "galecore-ai"
version = "0.1.0"
description = "GaleCore-AI — Cognitive infrastructure for GaleCore"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
    "fastapi>=0.111,<1",
    "uuid_utils>=0.9,<2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30,<1"]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/galecore_ai"]
