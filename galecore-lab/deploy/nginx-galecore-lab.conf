# WS-0088 F2: Lab detras de login GaleCore via auth_request. Reemplaza el basic auth de F1.
#
# nginx corre un subrequest a /App/GaleCore/Me/LabUpstream en la API local. Si el JWT del browser
# es valido, la API responde 204 con el header X-Lab-Upstream que indica a cual Lab rutear.
# Si no, la API responde 401/403 y nginx rechaza el request del Lab antes de proxearlo.
location /lab/ {
    # Preflight CORS: el browser lo manda anonimo, no debe chocar con auth_request.
    if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin'      $http_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods'     'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, X-Lab-Token, X-File-Name' always;
        add_header 'Access-Control-Max-Age'           '600' always;
        add_header 'Vary'                             'Origin' always;
        add_header 'Content-Length'                   '0';
        return 204;
    }

    auth_request       /_lab_auth;
    auth_request_set   $lab_upstream $upstream_http_x_lab_upstream;

    # CORS en la respuesta real (preflight va por el bloque de arriba). Lab ya pone Allow-Origin
    # segun Origin; nginx suma Credentials.
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # proxy_pass con variable no autodespoja el prefijo /lab/: hay que explicitarlo.
    rewrite ^/lab/(.*)$ /$1 break;
    proxy_pass         http://$lab_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_set_header   Host $lab_upstream;
    proxy_set_header   X-Forwarded-Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # El JWT no viaja al Lab: ya lo valido la API en el auth_request. El Lab usa su X-Lab-Token.
    proxy_set_header   Authorization "";
    proxy_buffering    off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Subrequest que valida la sesion GaleCore. Interno: nadie puede pegarle de afuera.
location = /_lab_auth {
    internal;
    proxy_pass              http://127.0.0.1:5001/App/GaleCore/Me/LabUpstream;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        Authorization $http_authorization;
    # Si el JWT venia por cookie en vez de header (no es nuestro caso hoy, pero por las dudas):
    proxy_set_header        Cookie $http_cookie;
}
