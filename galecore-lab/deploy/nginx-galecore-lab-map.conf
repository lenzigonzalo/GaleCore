# WS-0088: mapa de upgrade para los WebSocket del Lab (chat live, shell). Tiene que vivir a nivel
# http {} (no server {}), por eso va en conf.d/ y no en snippets/. Sin este mapa, los proxy_pass
# del Lab mandan `Connection: ` vacio y las conexiones upgrade fallan silenciosamente.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
