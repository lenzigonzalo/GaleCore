<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'none'; object-src 'none'; base-uri 'none'">
  <title>GaleCore · Tableros</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="GaleCore inicio"><span class="brand-mark">g.</span> GALECORE <small>LAB</small></a>
    <span class="top-divider"></span>
    <label class="project-label">Proyecto <select id="project" aria-label="Proyecto"></select></label>
    <nav class="tabs" aria-label="Vista del proyecto"><button data-action="tab" data-value="boards">Tableros</button><button data-action="tab" data-value="chat">Chat</button></nav>
    <span class="local-label"><i></i> Prototipo local <span> / datos de ejemplo</span></span>
  </header>
  <div class="workspace" id="workspace">
    <aside class="sidebar" id="sidebar" aria-label="Navegación de tableros"></aside>
    <main id="main"></main>
    <aside class="chat" id="chat" aria-label="Chat del proyecto"></aside>
  </div>
  <footer id="telemetry"></footer>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
